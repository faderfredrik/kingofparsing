<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>King of parsing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Figtree:wght@400;500;600;700&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECF3; --surface:#FFFFFF; --surface-2:#E3E8F1; --surface-3:#D3DBE8;
  --ink:#16213F; --muted:#5C6784; --lapis:#2346A8; --lapis-ink:#FFFFFF;
  --hero:#1C337A; --hero-ink:#F3C14E; --hero-muted:#A9B8E6;
  --gold:#F0B232; --gold-ink:#2B1E00; --gold-tint:#FBEFD2;
  --right:#1F8A5B; --right-tint:#D6EFE3; --right-ink:#125A3A;
  --wrong:#C63F2A; --wrong-tint:#F7DCD6; --wrong-ink:#8A2717;
  --focus:#F0B232;
  --greek:"Gentium Book Plus","Gentium Plus","GFS Didot","Noto Serif",Georgia,serif;
  --ui:"Figtree","Gentium Book Plus",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1530; --surface:#16214A; --surface-2:#1F2C5C; --surface-3:#2A3970;
    --ink:#EEF1FA; --muted:#9BA7C8; --lapis:#5677E0; --lapis-ink:#FFFFFF;
    --hero:#1B2C69; --hero-ink:#F6C658; --hero-muted:#93A3D8;
    --gold:#F4BC45; --gold-ink:#241900; --gold-tint:#3A3220;
    --right:#2FA872; --right-tint:#173F35; --right-ink:#8FE3BB;
    --wrong:#E05A43; --wrong-tint:#47222A; --wrong-ink:#FFB3A6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1530; --surface:#16214A; --surface-2:#1F2C5C; --surface-3:#2A3970;
  --ink:#EEF1FA; --muted:#9BA7C8; --lapis:#5677E0; --lapis-ink:#FFFFFF;
  --hero:#1B2C69; --hero-ink:#F6C658; --hero-muted:#93A3D8;
  --gold:#F4BC45; --gold-ink:#241900; --gold-tint:#3A3220;
  --right:#2FA872; --right-tint:#173F35; --right-ink:#8FE3BB;
  --wrong:#E05A43; --wrong-tint:#47222A; --wrong-ink:#FFB3A6;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:20px 20px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand svg{width:38px;height:38px;flex:none}
.brand b{white-space:nowrap;font-family:"Cinzel","Trajan Pro",Georgia,serif;font-size:25px;font-weight:800;letter-spacing:.01em;word-spacing:-.12em;line-height:1}
.brand b .of{font-size:.62em;font-weight:600;margin:0 .1em}
.top-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--muted);border:0}
.pill strong{color:var(--ink)}
button.pill:hover{background:var(--surface-2)}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.langsw{display:inline-flex;background:var(--surface);border-radius:999px;padding:3px;gap:2px;flex:none}
.langsw button{border:0;background:transparent;border-radius:999px;padding:5px 9px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;line-height:1;color:var(--muted)}
.langsw button:hover{background:var(--surface-2)}
.langsw button[aria-pressed="true"]{background:var(--lapis);color:var(--lapis-ink)}
.langsw button[aria-pressed="false"] .flag{opacity:.6}
.flag{width:21px;height:14px;border-radius:3px;display:block;flex:none;overflow:hidden}
.pill{white-space:nowrap}
@media (max-width:720px){
  .langsw .code{display:none}.langsw button{padding:5px 7px}
  header.top{flex-wrap:wrap;row-gap:10px}
  .top-right{display:contents}
  .top-meta{order:3;width:100%;justify-content:flex-start}
  .top-meta:empty{display:none}
}
.hidden{display:none!important}

/* setup */
.intro h1{font-family:var(--greek);font-size:clamp(30px,5vw,42px);line-height:1.1;margin:8px 0 8px;font-weight:700}
.intro p{color:var(--muted);margin:0 0 24px;max-width:62ch}
.credits{color:var(--muted);font-size:13px;line-height:1.5;margin:28px 0 0;max-width:72ch}
.credits a{color:inherit}
.block{background:var(--surface);border-radius:18px;padding:20px;margin-bottom:14px}
.block h2{font-size:16px;font-weight:700;margin:0 0 4px}
.block .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 16px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--lapis);color:var(--lapis-ink)}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.presets button{border:0;background:var(--surface-2);border-radius:9px;padding:7px 12px;font-size:14px;font-weight:600}
.presets button:hover{background:var(--surface-3)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.ch{border:0;background:var(--surface-2);border-radius:12px;padding:10px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.ch .n{font-size:20px;font-weight:700;line-height:1.1}
.ch .c{font-size:12px;color:var(--muted)}
.ch[aria-pressed="true"]{background:var(--lapis);color:var(--lapis-ink)}
.ch[aria-pressed="true"] .c{color:rgba(255,255,255,.8)}
.ch:disabled{opacity:.4;cursor:default}
.ch.wide{grid-column:span 2}
.ch.lvl{box-shadow:inset 0 0 0 3px var(--gold)}
.ch .lv{font-size:11px;font-weight:700;color:var(--gold)}
.ch[aria-pressed="true"] .lv{color:var(--gold)}
.selwrap{position:relative;display:inline-block;max-width:100%}
.selwrap::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel{font:inherit;font-weight:600;font-size:15px;background:var(--surface-2);color:var(--ink);border:0;border-radius:12px;padding:12px 44px 12px 14px;max-width:100%;appearance:none;-webkit-appearance:none;cursor:pointer}
.sel.manual{box-shadow:inset 0 0 0 3px var(--gold)}
.lvlnote{font-size:14px;color:var(--muted);margin:10px 0 0}
.status{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.status p{margin:0;max-width:60ch}
.status .big{font-size:18px;font-weight:700}
.status .muted{color:var(--muted);font-size:14px}
.note{background:var(--gold-tint);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px}

/* quiz */
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:18px 20px 34px;text-align:center;position:relative;margin-bottom:14px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--hero-muted);font-size:14px;font-weight:600;text-align:left}
.hint{border:0;background:rgba(255,255,255,.1);color:var(--hero-ink);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.hint:hover{background:rgba(255,255,255,.18)}
.hint svg{width:16px;height:16px}
.form{font-family:var(--greek);font-size:clamp(52px,11vw,100px);line-height:1.15;margin:22px 0 4px;word-break:break-word}
.bd{margin:14px auto 10px;max-width:760px}
.bd-arrow{display:block;margin:0 auto 6px;width:18px;height:18px;color:var(--hero-muted)}
.segs{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:12px 6px}
.mseg{display:flex;flex-direction:column;align-items:stretch;min-width:46px;color:#fff;animation:pop .5s cubic-bezier(.2,.9,.3,1.25) both}
.mseg .lab{font-size:12px;font-weight:700;color:var(--hero-muted);text-align:center;white-space:nowrap;padding:0 2px 9px}
.mseg .br{height:10px;border:2px solid currentColor;border-bottom:0;border-radius:4px 4px 0 0;position:relative;opacity:.55;margin:0 3px}
.mseg .br::before{content:"";position:absolute;left:50%;top:-8px;width:2px;height:7px;background:currentColor;transform:translateX(-50%)}
.mseg .mo{font-family:var(--greek);font-size:34px;line-height:1.2;padding:3px 6px 0;text-align:center}
.mseg.t-stem{color:var(--hero-ink)}
.mseg.t-pre,.mseg.t-aug,.mseg.t-red{color:#C9D4F5}
.plus{color:var(--hero-muted);font-size:22px;line-height:1;padding-bottom:12px;animation:fade .4s both}
.bdnotes{list-style:none;margin:16px auto 0;padding:14px 16px;max-width:600px;background:rgba(255,255,255,.07);border-radius:14px;color:#DCE3F8;font-size:14.5px;text-align:left;display:grid;gap:6px;animation:fade .5s .3s both}
.bdnotes li{padding-left:18px;position:relative}
.bdnotes li::before{content:"";position:absolute;left:3px;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--hero-ink)}
.bdnone{color:var(--hero-muted);font-size:14px;margin:6px 0 0}
@keyframes pop{from{opacity:0;transform:translateY(-22px) scale(.8)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:720px){.mseg .mo{font-size:26px}.mseg{min-width:38px}.mseg .lab{font-size:11px}}
.gloss{color:var(--hero-muted);font-size:15px;min-height:1.5em;max-width:56ch;margin:0 auto}
.gloss em{font-style:normal;color:#fff}
.gloss em.infl{display:block;font-size:20px;font-weight:600;line-height:1.35}
.gloss .base{display:block;font-size:13.5px;margin-top:4px}
.fields{display:grid;gap:12px;grid-template-columns:repeat(6,1fr)}
.field{background:var(--surface);border-radius:16px;padding:14px 14px 16px;grid-column:span 2;min-width:0}
.field.w3{grid-column:span 3}.field.w6{grid-column:span 6}.field.w4{grid-column:span 4}
.field h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--muted)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.opts.lex{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opt{hyphens:manual;overflow-wrap:break-word;border:0;background:var(--surface-2);border-radius:10px;padding:11px 8px;font-weight:600;font-size:15px;line-height:1.25;min-height:46px}
.opt small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
@media (hover:hover){.opt:hover:not(:disabled):not([aria-pressed="true"]){background:var(--surface-3)}}
.opt[aria-pressed="true"]{background:var(--lapis);color:var(--lapis-ink)}
.opt[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.opt.lone{background:var(--gold-tint);color:var(--ink);cursor:default}
.opt.greek{font-family:var(--greek);font-size:20px;font-weight:400}
.opt:disabled{cursor:default}
.opt.ok{background:var(--right)!important;color:#fff!important}
.opt.bad{background:var(--wrong)!important;color:#fff!important}
.opt.miss{background:var(--right-tint)!important;color:var(--right-ink)!important;box-shadow:inset 0 0 0 2px var(--right)}
.opt.ok small,.opt.bad small{color:rgba(255,255,255,.85)}
.fnote{font-size:12.5px;color:var(--muted);margin:8px 0 0}

.result{border-radius:18px;overflow:hidden;margin-top:14px;background:var(--surface)}
.result .head{padding:14px 20px;font-weight:700;font-size:18px;color:#fff;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.result.good .head{background:var(--right)} .result.badr .head{background:var(--wrong)}
.result .head span{font-weight:500;font-size:14px;opacity:.9}
.result .body{padding:16px 20px 20px;display:grid;gap:14px}
.parse{font-size:17px;font-weight:600}
.parse .also{display:block;font-weight:500;font-size:14px;color:var(--muted);margin-top:4px}
.entry{display:grid;gap:2px}
.entry .lx{font-family:var(--greek);font-size:22px}
.entry .pp{font-family:var(--greek);font-size:17px;color:var(--muted)}
.entry .m{color:var(--muted);font-size:15px}
.verse{background:var(--surface-2);border-radius:12px;padding:12px 16px}
.verse .ref{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.verse .txt{font-family:var(--greek);font-size:19px;line-height:1.6}
.verse mark{background:var(--gold);color:var(--gold-ink);border-radius:4px;padding:0 3px}

.actionbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.actionbar .in{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.kbd{color:var(--muted);font-size:14px}
kbd{font-family:var(--ui);background:var(--surface);border-radius:6px;padding:2px 7px;font-weight:600;color:var(--ink);font-size:13px}
.primary{border:0;background:var(--gold);color:var(--gold-ink);border-radius:12px;padding:14px 26px;font-weight:700;font-size:16px}
.primary:hover:not(:disabled){filter:brightness(1.05)}
.primary:disabled{opacity:.45;cursor:default}
.ghost{border:0;background:var(--surface);border-radius:12px;padding:14px 20px;font-weight:600}
.ghost:hover{background:var(--surface-2)}

/* summary */
.score{font-family:var(--greek);font-size:clamp(64px,14vw,120px);line-height:1;color:var(--hero-ink);margin:10px 0}
.misslist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.misslist li{background:var(--surface-2);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.misslist .g{font-family:var(--greek);font-size:22px;min-width:7ch}
.misslist .d{color:var(--muted);font-size:14px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

@media (max-width:720px){
  .fields{grid-template-columns:1fr}
  .field,.field.w2,.field.w3,.field.w4,.field.w6{grid-column:1/-1}
  .opts{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .opts.lex{grid-template-columns:1fr 1fr}
  .brand b{font-size:19px}
  .brand svg{width:30px;height:30px}
  .wrap{padding:14px 14px 120px}
  .kbd{display:none}
  .actionbar .in{justify-content:flex-end}
  .primary{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="flag-sv" viewBox="0 0 16 10" preserveAspectRatio="xMidYMid slice"><rect width="16" height="10" fill="#006AA7"/><rect x="5" width="2" height="10" fill="#FECC00"/><rect y="4" width="16" height="2" fill="#FECC00"/></symbol>
  <symbol id="flag-en" viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice"><clipPath id="flag-en-t"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath><rect width="60" height="30" fill="#012169"/><path d="M0,0L60,30M60,0L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0L60,30M60,0L0,30" clip-path="url(#flag-en-t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></symbol>
</defs></svg>
<div class="wrap">
  <header class="top">
    <button class="brand" id="homeBtn" data-ia="home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path fill="var(--gold)" d="M2.5 14C3.5 5 11 0.5 20 0.5S36.5 5 37.5 14L32.6 14C31 9.5 26.5 6.6 20 6.6S9 9.5 7.4 14Z"/><path fill="var(--gold)" fill-rule="evenodd" d="M8 17C8 11 13 8 20 8S32 11 32 17L32 28C32 32 29 35.5 25 38.5L15 38.5C11 35.5 8 32 8 28Z M11.5 18.5L18.6 19.4L18.6 26L21.4 26L21.4 19.4L28.5 18.5L28 22L22.6 23.8L22.4 38.5L17.6 38.5L17.4 23.8L12 22Z"/></svg>
      <b>King <span class="of">of</span> Parsing</b>
    </button>
    <div class="top-right">
      <div class="top-meta" id="topMeta"></div>
      <div class="langsw" id="langSw" role="group" aria-label="Språk / Language">
        <button data-lang="sv" lang="sv" title="Svenska" aria-label="Svenska"><svg class="flag" aria-hidden="true"><use href="#flag-sv"/></svg><span class="code" aria-hidden="true">SV</span></button>
        <button data-lang="en" lang="en" title="English" aria-label="English"><svg class="flag" aria-hidden="true"><use href="#flag-en"/></svg><span class="code" aria-hidden="true">EN</span></button>
      </div>
    </div>
  </header>

  <!-- SETUP -->
  <main id="setup">
    <div class="intro">
      <h1 data-i="h1"></h1>
      <p data-i="intro"></p>
    </div>
    <section class="block">
      <h2 data-i="book"></h2>
      <p class="sub" id="bookSub"></p>
      <div class="seg" id="bookSeg" role="group" data-ia="book"></div>
    </section>
    <section class="block">
      <h2 data-i="type"></h2>
      <p class="sub" id="typeSub"></p>
      <div class="seg" id="typeSeg" role="group" data-ia="type">
        <button data-t="N" data-i="tN"></button><button data-t="V" data-i="tV"></button><button data-t="NV" data-i="tNV"></button>
      </div>
    </section>
    <section class="block">
      <h2 data-i="lvlH"></h2>
      <p class="sub"><span id="lvlBook"></span> <span data-i="lvlSub"></span></p>
      <span class="selwrap"><select id="lvlSel" class="sel" data-ia="lvlAria"></select></span>
      <p class="lvlnote" id="lvlNote"></p>
    </section>
    <section class="block">
      <h2 data-i="chH"></h2>
      <p class="sub"><span data-i="chSub"></span><span id="goldNote" data-i="goldNote"></span></p>
      <div class="presets" id="presets"></div>
      <div class="chgrid" id="chGrid"></div>
    </section>
    <section class="block">
      <h2 data-i="lenH"></h2>
      <p class="sub" data-i="lenSub"></p>
      <div class="seg" id="lenSeg" role="group" data-ia="lenAria">
        <button data-l="10">10</button><button data-l="20">20</button><button data-l="50">50</button><button data-l="0" data-i="free"></button>
      </div>
    </section>
    <section class="block status">
      <div>
        <p class="big" id="poolLine"></p>
        <p class="muted" id="gramLine"></p>
        <div class="note hidden" id="poolNote"></div>
      </div>
    </section>
    <p class="credits" data-i="credits"></p>
  </main>

  <!-- QUIZ -->
  <main id="quiz" class="hidden">
    <div class="bar"><i id="barFill"></i></div>
    <section class="hero" aria-live="polite">
      <div class="hero-top">
        <span id="qCount"></span>
        <button class="hint" id="hintBtn"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1a5 5 0 0 0-3 9v2h6v-2a5 5 0 0 0-3-9zM6 13.5h4V15H6z" fill="currentColor"/></svg><span data-i="hint"></span></button>
      </div>
      <div class="form" id="qForm" lang="grc"></div>
      <div id="qBreak"></div>
      <p class="gloss" id="qGloss"></p>
    </section>
    <div class="fields" id="fields"></div>
    <div id="resultBox"></div>
  </main>

  <!-- SUMMARY -->
  <main id="summary" class="hidden"></main>
</div>

<div class="actionbar" id="actionbar">
  <div class="in">
    <span class="kbd" id="kbdHint"></span>
    <div class="btnrow" style="margin:0" id="actBtns"></div>
  </div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const W=D.words.map((a,i)=>({i,ch:a[0],t:a[1],w:a[2],h:a[3],m:a[4],pp:a[5]}));
const F=D.forms.map((a,i)=>({i,f:a[0],w:a[1],codes:a[2].split('|'),n:a[3],ref:a[4]}));

function gramText(M){
  const h=k=>M.has(k),parts=[];
  if(h(6)||h(7)) parts.push(tx(h(7)?(h(6)?'nAll':'nGDV'):'nNA'));
  const t=[];if(h(16)||h(18))t.push('P');if(h(19)||h(24))t.push('F');if(h(21))t.push('I');if(h(22)||h(24))t.push('A');if(h(25))t.push('X');
  const m=[];if(h(27)||h(28)||h(30))m.push('P');if(h(31))m.push('S');if(h(32))m.push('N');if(h(33))m.push('D');
  if(t.length||m.length) parts.push(tx('verbs',t.map(x=>L.tw[x]),t.length&&!h(18)&&!h(24),m.map(x=>L.mw[x])));
  const pre=B.gram?tx('gramPre',level()):tx('gramPreF');
  return parts.length?pre+andList(parts)+'.':tx('gramNone');
}

const autoLevel=()=>{const c=S.chapters.filter(x=>x!==99);return S.chapters.includes(99)?Math.max(0,...CHAPTERS.filter(x=>x!==99)):Math.max(0,...c)};
const level=()=>S.level||autoLevel();
/* uppsättningen grammatiska moment som är inlärda på nuvarande nivå */
function momentSet(){
  if(!B.gram) return new Set(MOMENTS.map(m=>m[0]).filter(k=>k<=(S.level||33)));
  const lvl=level();return new Set(MOMENTS.map(m=>m[0]).filter(k=>B.gram[k]<=lvl));
}

function buildPool(){
  const M=momentSet(),chs=new Set(S.chapters),ws=[];
  W.forEach(w=>{
    if(!chs.has(w.ch)||!S.types.includes(w.t)) return;
    const fs=(byWord[w.i]||[]).filter(f=>f.codes.some(c=>learned(w.t,c,M)));
    if(fs.length) ws.push({w,fs});
  });
  return ws;
}

/* ---------- session ---------- */
let sess=null,q=null;
function startSession(retry){if(!Array.isArray(retry))retry=null;
  const pool=buildPool();
  if(!pool.length&&!retry) return;
  sess={pool,M:momentSet(),total:retry?retry.length:S.len,i:0,correct:0,answered:0,misses:[],used:new Set(),retry:retry?[...retry]:null};
  show('quiz');nextQuestion();
}
function pickForm(){
  if(sess.retry){return sess.retry.shift()}
  for(let k=0;k<80;k++){
    const p=sess.pool[Math.floor(Math.random()*sess.pool.length)];
    const f=p.fs[Math.floor(Math.random()*p.fs.length)];
    if(!sess.used.has(f.i)||k>60){sess.used.add(f.i);return f}
  }
  return sess.pool[0].fs[0];
}
function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f\u1fbd\u1fbf\u1ffe]/g,'').toLowerCase()}
function distractors(word){
  const pool=sess.pool.map(p=>p.w).filter(w=>w.t===word.t),maxCh=autoLevel();
  const seen=new Set([norm(word.h)]),out=[];
  const tryAdd=list=>{shuffle(list).forEach(w=>{if(out.length<3&&!seen.has(norm(w.h))){seen.add(norm(w.h));out.push(w)}})};
  // prefer look-alikes: same first letter
  const first=norm(word.h)[0];
  tryAdd(pool.filter(w=>norm(w.h)[0]===first));
  tryAdd(pool);
  tryAdd(W.filter(w=>w.t===word.t&&w.ch<=maxCh));
  tryAdd(W.filter(w=>w.t===word.t));
  return shuffle([word,...out]);
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function nextQuestion(){
  if(sess.total&&sess.i>=sess.total){return renderSummary()}
  const f=pickForm(),word=W[f.w];
  const acc=f.codes.filter(c=>learned(word.t,c,sess.M));
  q={f,word,acc:acc.length?acc:f.codes,sel:{},checked:false,hint:false,lex:distractors(word),opts:availOpts(word.t,sess.M)};
  // preselect single-option fields
  ['tense','voice','mood','case'].forEach(k=>{if(q.opts[k]&&q.opts[k].length===1&&fieldsFor().includes(k))q.sel[k]=q.opts[k]});
  sess.i++;
  renderQuiz();
}
function fieldsFor(moodOverride){
  if(q.word.t==='N') return ['case','number','gender','lex'];
  const m=moodOverride!==undefined?moodOverride:q.sel.mood;
  if(m==='P') return ['tense','voice','mood','case','number','gender','lex'];
  if(m==='N') return ['tense','voice','mood','lex'];
  return ['tense','voice','mood','person','number','lex'];
}
function codeOf(sel,t){
  if(t==='N') return (sel.case||'?')+(sel.number||'?')+(sel.gender||'?');
  const b=(sel.tense||'?')+(sel.voice||'?')+(sel.mood||'?');
  if(sel.mood==='N') return b;
  if(sel.mood==='P') return b+(sel.case||'?')+(sel.number||'?')+(sel.gender||'?');
  return b+(sel.person||'?')+(sel.number||'?');
}
function decode(code,t){
  if(t==='N') return {case:code[0],number:code[1],gender:code[2]};
  const o={tense:code[0],voice:code[1],mood:code[2]};
  if(o.mood==='P'){o.case=code[3];o.number=code[4];o.gender=code[5]}
  else if(o.mood!=='N'){o.person=code[3];o.number=code[4]}
  return o;
}
function describe(code,t){
  const o=decode(code,t),lc=s=>s.toLowerCase();
  if(t==='N') return `${L.case[o.case]} ${lc(L.number[o.number])} ${lc(L.gender[o.gender])}`;
  const voice=o.voice==='M'?lc(L.voice.M.split(' /')[0]):lc(L.voice[o.voice]);
  let s=`${L.tense[o.tense]} ${voice} ${lc(L.mood[o.mood])}`;
  if(o.mood==='P') s+=`, ${lc(L.case[o.case])} ${lc(L.number[o.number])} ${lc(L.gender[o.gender])}`;
  else if(o.mood!=='N') s+=`, ${L.person[o.person]} ${lc(L.number[o.number])}`;
  return s;
}

function breakdownHTML(){
  const m=FA[q.f.i],ix=m?m[q.best]:undefined;
  if(ix===undefined){
    const part=q.word.t==='V'&&q.best[2]==='P';
    return `<p class="bdnone">${tx(part?'noPart':'irregular')}</p>`;
  }
  const [ms,notes]=AN[ix];

  ms.forEach(([t,x],i)=>{
    const lab=t==='end'?(q.word.t==='N'?L.morph.endN:L.morph.end):L.morph[t];
    const dl=reduce?0:120+i*110;
    if(i) h+=`<span class="plus" style="animation-delay:${dl-60}ms" aria-hidden="true">+</span>`;
    h+=`<div class="mseg t-${t}" style="animation-delay:${dl}ms"><span class="lab">${lab}</span><span class="br"></span><span class="mo" lang="grc">${esc(x||'–')}</span></div>`;

  return h+'</div>';

stand:understood:understood wake:woke:woken wear:wore:worn weave:wove:woven weep:wept:wept win:won:won wind:wound:wound withdraw:withdrew:withdrawn withhold:withheld:withheld withstand:withstood:withstood write:wrote:written').split(' ').forEach(x=>{const [a,b,c]=x.split(':');o[a]=[b,c]});return o})();
const STATIVE=new Set(['be','have','know','want','wish','need','belong','own','possess','seem','resemble']);
const vow=c=>'aeiou'.includes(c);
const DBL2=new Set(['admit','commit','emit','omit','permit','submit','transmit','acquit','compel','dispel','expel','propel','repel','rebel','confer','defer','infer','prefer','refer','transfer','deter','occur','incur','recur','regret','control','patrol','equip','abhor','annul']);
function dbl(v){ // stop -> stopp, permit -> permitt
  if(DBL2.has(v)) return v+v.slice(-1);
  const m=v.match(/^[^aeiou]*[aeiou][^aeiouwxy]$/);
  return m?v+v.slice(-1):v;
}
function engPast(v){
  if(IRR[v]) return IRR[v][0];
  if(v.endsWith('e')) return v+'d';
  if(/[^aeiou]y$/.test(v)) return v.slice(0,-1)+'ied';
  return dbl(v)+'ed';
}
function engPP(v){ if(IRR[v]) return IRR[v][1]; return engPast(v)}
function engIng(v){
  if(v==='be') return 'being';
  if(v.endsWith('ie')) return v.slice(0,-2)+'ying';
  if(v.endsWith('e')&&!/(ee|ye|oe)$/.test(v)) return v.slice(0,-1)+'ing';
  return dbl(v)+'ing';
}
function engS3(v){
  if(v==='be') return 'is'; if(v==='have') return 'has'; if(v==='do') return 'does'; if(v==='go') return 'goes';
  if(/(s|x|z|ch|sh|o)$/.test(v)) return v+'es';
  if(/[^aeiou]y$/.test(v)) return v.slice(0,-1)+'ies';
  return v+'s';
}
const SUBJ={'1S':'I','2S':'you (sg.)','3S':'he/she/it','1P':'we','2P':'you (pl.)','3P':'they'};
function firstSense(m,num){
  let s=m.replace(/\([^)]*\)/g,' ').replace(/\[[^\]]*\]/g,' ');
  const sg=s.match(/sg\.?:\s*([^;]+)/i),pl=s.match(/pl\.?:\s*([^;]+)/i);
  if(num==='P'&&pl) s=pl[1]; else if(sg) s=sg[1];
  s=s.split(/[;,]/)[0].replace(/\s+/g,' ').trim();
  return s;
}
function pickVoice(m,voice){
  const seg={};m.split(';').forEach(p=>{const k=p.match(/^\s*(active|middle|passive|intrans|trans|noun)\.?:\s*(.*)$/i);if(k)seg[k[1].toLowerCase()]=k[2]});
  if(!Object.keys(seg).length) return m;
  if(voice==='P') return seg.passive||seg.middle||seg.active||seg.intrans||m;
  if(voice==='M') return seg.middle||seg.active||seg.intrans||m;
  return seg.active||seg.intrans||seg.noun||m;
}
function verbBase(m){
  const s=firstSense(m);
  const g=s.match(/^(?:I|to)\s+(.+)$/); if(!g) return null;
  let w=g[1].split(' '),v=w[0].toLowerCase(),rest=w.slice(1).join(' ');
  if(v==='am') v='be';
  if(!/^[a-z]+$/.test(v)) return null;
  return {v,rest:rest?' '+rest:''};
}
function verbTr(word,code){
  const t=code[0],m=code[2];
  const segd=pickVoice(word.m,code[1]),hasSeg=segd!==word.m;
  const b=verbBase(segd); if(!b) return null;
  const {v,rest}=b;
  const dep=/μαι$/.test(word.h);
  const pass=(code[1]==='P'||(code[1]==='M'&&'PIXY'.includes(t)&&!/μαι$/.test(word.h)&&!(hasSeg&&/middle:/i.test(word.m))))&&!dep&&v!=='be'&&!(hasSeg&&/(passive|middle):/i.test(word.m));
  const pp=engPP(v)+rest;
  const be=(pn,tense)=>{
    if(tense==='pres') return {'1S':'am','3S':'is'}[pn]||'are';
    return (pn==='1S'||pn==='3S')?'was':'were';
  };
  if(m==='N'){
    if(pass) return 'to '+(t==='X'?'have been ':'be ')+pp;
    if(t==='X') return 'to have '+pp;
    if(t==='F') return 'to be going to '+v+rest;
    return 'to '+v+rest;
  }
  if(m==='P'){
    if(pass) return (t==='P'?'being ':'having been ')+pp;
    if(t==='P') return engIng(v)+rest;
    return 'having '+pp;
  }
  const pn=code.slice(3,5),S=SUBJ[pn],s3=pn==='3S';
  if(m==='D'){
    const core=pass?'be '+pp:v+rest;
    if(pn[0]==='3') return `let ${pn==='3S'?'him/her/it':'them'} ${core}!`;
    return core+'!'+(pn==='2P'?' (pl.)':'');
  }
  if(m==='S') return `${S} might ${pass?'be '+pp:v+rest}`;
  // indicative
  let vp;
  if(t==='P'){
    if(pass) vp=be(pn,'pres')+' being '+pp;
    else if(v==='be') vp=be(pn,'pres')+rest;
    else vp=(s3?engS3(v):v)+rest;
  } else if(t==='I'){
    if(pass) vp=be(pn,'past')+' being '+pp;
    else if(v==='be') vp=be(pn,'past')+rest;
    else if(STATIVE.has(v)) vp=engPast(v)+rest;
    else vp=be(pn,'past')+' '+engIng(v)+rest;
  } else if(t==='F') vp='will '+(pass?'be '+pp:v+rest);
  else if(t==='A') vp=pass?be(pn,'past')+' '+pp:(v==='be'?be(pn,'past'):engPast(v))+rest;
  else if(t==='X') vp=(s3?'has':'have')+(pass?' been ':' ')+pp;
  else if(t==='Y') vp='had'+(pass?' been ':' ')+pp;
  return S+' '+vp;
}
const NIRR={man:'men',woman:'women',child:'children',foot:'feet',tooth:'teeth',sheep:'sheep',fish:'fish',ox:'oxen',mouse:'mice',person:'people',leaf:'leaves',life:'lives',wife:'wives',knife:'knives',thief:'thieves',loaf:'loaves',wolf:'wolves',half:'halves',shelf:'shelves',calf:'calves',goose:'geese',people:'people',heaven:'heavens'};
function engPl(n){
  const w=n.split(' '),l=w.pop().toLowerCase();
  let p=NIRR[l]||(/(s|x|z|ch|sh)$/.test(l)?l+'es':/[^aeiou]y$/.test(l)?l.slice(0,-1)+'ies':l+'s');
  return [...w,p].join(' ');
}
function nounTr(word,code){
  let s=firstSense(pickVoice(word.m,'A'),code[1]);
  if(!s||/[^A-Za-z '\-]/.test(s)) return null;
  const proper=/^[A-Z]/.test(s);
  s=s.replace(/^(a|an|the)\s+/i,'');
  const n=code[1]==='P'&&!proper&&!/^the\s/i.test(firstSense(word.m,'P'))&&!(/pl\.?:/i.test(word.m))?engPl(s):s;
  const np=proper?n:'the '+n;
  switch(code[0]){
    case 'N': return np+' ('+tx('subj')+')';
    case 'G': return 'of '+np;
    case 'D': return 'to/for '+np;
    case 'A': return np+' ('+tx('obj')+')';
    case 'V': return 'O '+n+'!';
  }
  return null;
}
function inflTr(word,code){try{return word.t==='N'?nounTr(word,code):verbTr(word,code)}catch(e){return null}}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function renderFields(){
  const box=$('fields');box.innerHTML='';
  const t=q.word.t;
  const best=q.checked?decode(q.best,t):null;
  const list=q.checked?fieldsFor(best.mood):fieldsFor();
  const widths=t==='N'?{case:'w6',number:'w3 half',gender:'w3 half',lex:'w6'}:
    (list.includes('case')?{tense:'w3',voice:'w3',mood:'w6',case:'w6',number:'w2 half',gender:'w4 half',lex:'w6'}:
     list.includes('person')?{tense:'w2',voice:'w2',mood:'w2',person:'w4',number:'w2',lex:'w6'}:{tense:'w2',voice:'w2',mood:'w2',lex:'w6'});
  list.forEach(k=>{
    const el=document.createElement('section');
    el.className='field '+(widths[k]||'w2');
    const h=document.createElement('h3');h.textContent=L.field[k];el.appendChild(h);
    const o=document.createElement('div');o.className='opts'+(k==='lex'?' lex':'');
    if(k==='lex'){
      q.lex.forEach(w=>o.appendChild(optBtn('lex',w.i,w.h,null,true)));
    } else {
      const avail=q.opts[k].split('');
      avail.forEach(v=>o.appendChild(optBtn(k,v,L[k][v],k==='person'?L.personSub[v]:null,false,avail.length===1)));
    }
    el.appendChild(o);
    if(k==='mood'&&q.opts.mood.length===1){const n=document.createElement('p');n.className='fnote';const c=firstCh([27,28,30,31,32,33]);n.textContent=c?tx('moodNote',c):tx('moodNoteF');el.appendChild(n)}
    if(k==='voice'&&q.opts.voice.length===1){const n=document.createElement('p');n.className='fnote';const c=firstCh([18,24]);n.textContent=c?tx('voiceNote',c):tx('voiceNoteF');el.appendChild(n)}
    if(k==='case'&&t==='N'&&q.opts.case.length===2){const n=document.createElement('p');n.className='fnote';const c=momCh(7);n.textContent=c?tx('caseNote',c):tx('caseNoteF');el.appendChild(n)}
    box.appendChild(el);
  });
}
function optBtn(k,v,label,sub,greek,lone){
  const b=document.createElement('button');
  b.className='opt'+(greek?' greek':'')+(lone&&!q.checked?' lone':'');
  if(greek) b.lang='grc';
  b.innerHTML=esc(label)+(sub?`<small>${esc(sub)}</small>`:'');
  const val=k==='lex'?v:v;
  const selected=q.sel[k]===val;
  if(q.checked){
    b.disabled=true;
    const right=k==='lex'?val===q.word.i:decode(q.best,q.word.t)[k]===val;
    if(selected&&right)b.classList.add('ok');
    else if(selected)b.classList.add('bad');
    else if(right)b.classList.add('miss');
  } else {
    b.setAttribute('aria-pressed',selected);
    if(lone) b.disabled=false;
    b.onclick=()=>{
      if(lone) return;
      q.sel[k]=selected?undefined:val;
      if(k==='mood'){ // reset fields that no longer apply
        const keep=fieldsFor();Object.keys(q.sel).forEach(x=>{if(!keep.includes(x))delete q.sel[x]});
      }
      renderFields();
    };
  }
  return b;
}

function check(){
  if(q.checked) return;
  const t=q.word.t;
  const flds=fieldsFor().filter(k=>k!=='lex');
  // find accepted parse closest to the answer
  let best=q.acc[0],bs=-1;
  q.acc.forEach(c=>{const d=decode(c,t);let s=0;Object.keys(d).forEach(k=>{if(q.sel[k]===d[k])s++});if(s>bs){bs=s;best=c}});
  q.best=best;
  const code=codeOf(q.sel,t);
  q.parseOK=q.acc.includes(code);
  q.lexOK=q.sel.lex===q.word.i;
  q.ok=q.parseOK&&q.lexOK;
  q.checked=true;
  sess.answered++;life.a++;
  if(q.ok){sess.correct++;life.c++}else sess.misses.push(q.f);
  saveLife();
  renderQuiz();
  const r=$('resultBox');if(r.firstChild) r.firstChild.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
}
function renderResult(){
  const {f,word}=q,t=word.t;
  const others=q.acc.filter(c=>c!==q.best);
  const [bcv,idx]=f.ref.split('.');
  const toks=(D.verses[bcv]||'').split(' ');
  const verse=toks.map((w,i)=>i===+idx?`<mark>${esc(w)}</mark>`:esc(w)).join(' ');
  const ref=`${L.books[+bcv.slice(0,2)-1]} ${+bcv.slice(2,4)}:${+bcv.slice(4,6)}`;
  const head=tx(q.ok?'right':(q.parseOK?'rightParse':q.lexOK?'rightLex':'wrong'));
  $('resultBox').innerHTML=`<section class="result ${q.ok?'good':'badr'}">
    <div class="head">${head}<span>${tx('score',sess.correct,sess.answered)}</span></div>
    <div class="body">
      <div class="parse"><span lang="grc" style="font-family:var(--greek);font-weight:400;font-size:20px">${esc(f.f)}</span>: ${esc(describe(q.best,t))}
        ${others.length?`<span class="also">${esc(tx('also',andList(others.map(c=>describe(c,t).toLowerCase()))))}</span>`:''}</div>
      <div class="entry"><span class="lx" lang="grc">${esc(word.w)}</span>
        ${word.pp&&word.pp.replace(/[–\s,]/g,'')?`<span class="pp" lang="grc">${esc(word.pp)}</span>`:''}
        <span class="m">${esc(word.m)}${word.ch===99?tx('outside'):esc(tx('bookCh',B.name,word.ch))}</span></div>
      <div class="verse"><div class="ref">${tx('occurs',tx('times',f.n),ref)}</div><div class="txt" lang="grc">${verse}</div></div>
    </div></section>`;
}

function renderSummary(){
  show('summary');
  const pct=sess.answered?Math.round(sess.correct/sess.answered*100):0;
  const ms=sess.misses;
  $('summary').innerHTML=`<section class="block" style="text-align:center;background:var(--hero);color:var(--hero-muted)">
      <p style="margin:6px 0 0;font-weight:600">${tx('done')}</p>
      <div class="score">${sess.correct}/${sess.answered}</div>
      <p style="margin:0 0 8px">${tx('summary',pct,life.a,life.c)}</p>
    </section>
    ${ms.length?`<section class="block"><h2>${tx('missH')}</h2><p class="sub">${tx('missSub',ms.length)}</p>
    <ul class="misslist">${ms.map(f=>{const w=W[f.w];const acc=f.codes.filter(c=>learned(w.t,c,sess.M));return `<li><span class="g" lang="grc">${esc(f.f)}</span><span class="d">${esc(describe((acc[0]||f.codes[0]),w.t))}, ${tx('from')} <span lang="grc" style="font-family:var(--greek);font-size:17px;color:var(--ink)">${esc(w.h)}</span></span></li>`}).join('')}</ul></section>`
    :`<section class="block"><h2>${tx('flawless')}</h2><p class="sub" style="margin:0">${tx('flawlessSub')}</p></section>`}`;
  setTop('summary');
  const acts=[];
  if(ms.length) acts.push({label:tx('practiceMissed'),primary:true,fn:()=>startSession(shuffle(ms))});
  acts.push({label:tx('changeSettings'),fn:()=>{show('setup');renderSetup()}});
  acts.push({label:tx('newRound'),primary:!ms.length,fn:()=>startSession()});
  setActions(acts,'');
}

/* ---------- chrome ---------- */
function show(id){['setup','quiz','summary'].forEach(x=>$(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0)}
function setTop(view){
  const m=$('topMeta');
  if(view==='quiz'){
    m.innerHTML=`<span class="pill">${tx('topScore',sess.correct,sess.answered)}</span><button class="pill" id="endBtn">${tx('end')}</button>`;
    $('endBtn').onclick=()=>{if(sess.answered)renderSummary();else{show('setup');renderSetup()}};
  } else m.innerHTML=life.a?`<span class="pill">${tx('topTotal',life.c,life.a)}</span>`:'';
}
let actFns=[];
function setActions(list,hint){
  $('kbdHint').innerHTML=hint;
  const box=$('actBtns');box.innerHTML='';actFns=list;
  list.forEach(a=>{const b=document.createElement('button');b.className=a.primary?'primary':'ghost';b.textContent=a.label;b.disabled=!!a.disabled;b.onclick=a.fn;box.appendChild(b)});
}
$('hintBtn').onclick=()=>{q.hint=true;renderQuiz()};
$('homeBtn').onclick=()=>{show('setup');renderSetup()};
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.metaKey||e.ctrlKey) return;
  if(!$('quiz').classList.contains('hidden')){
    e.preventDefault();
    if(q.checked) nextQuestion(); else check();
  }
});
renderSetup();
})();
</script>
