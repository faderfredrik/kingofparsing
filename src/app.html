<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>King of parsing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Figtree:wght@400;500;600;700&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECF3; --surface:#FFFFFF; --surface-2:#E3E8F1; --surface-3:#D3DBE8;
  --ink:#16213F; --muted:#5C6784; --lapis:#2346A8; --lapis-ink:#FFFFFF;
  --hero:#1C337A; --hero-ink:#F3C14E; --hero-muted:#A9B8E6;
  --gold:#F0B232; --gold-ink:#2B1E00; --gold-tint:#FBEFD2;
  --right:#1F8A5B; --right-tint:#D6EFE3; --right-ink:#125A3A;
  --wrong:#C63F2A; --wrong-tint:#F7DCD6; --wrong-ink:#8A2717;
  --focus:#F0B232;
  --greek:"Gentium Book Plus","Gentium Plus","GFS Didot","Noto Serif",Georgia,serif;
  --ui:"Figtree","Gentium Book Plus",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1530; --surface:#16214A; --surface-2:#1F2C5C; --surface-3:#2A3970;
    --ink:#EEF1FA; --muted:#9BA7C8; --lapis:#5677E0; --lapis-ink:#FFFFFF;
    --hero:#1B2C69; --hero-ink:#F6C658; --hero-muted:#93A3D8;
    --gold:#F4BC45; --gold-ink:#241900; --gold-tint:#3A3220;
    --right:#2FA872; --right-tint:#173F35; --right-ink:#8FE3BB;
    --wrong:#E05A43; --wrong-tint:#47222A; --wrong-ink:#FFB3A6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1530; --surface:#16214A; --surface-2:#1F2C5C; --surface-3:#2A3970;
  --ink:#EEF1FA; --muted:#9BA7C8; --lapis:#5677E0; --lapis-ink:#FFFFFF;
  --hero:#1B2C69; --hero-ink:#F6C658; --hero-muted:#93A3D8;
  --gold:#F4BC45; --gold-ink:#241900; --gold-tint:#3A3220;
  --right:#2FA872; --right-tint:#173F35; --right-ink:#8FE3BB;
  --wrong:#E05A43; --wrong-tint:#47222A; --wrong-ink:#FFB3A6;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:20px 20px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand svg{width:38px;height:38px;flex:none}
.brand b{white-space:nowrap;font-family:"Cinzel","Trajan Pro",Georgia,serif;font-size:25px;font-weight:800;letter-spacing:.01em;word-spacing:-.12em;line-height:1}
.brand b .of{font-size:.62em;font-weight:600;margin:0 .1em}
.top-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--muted);border:0}
.pill strong{color:var(--ink)}
button.pill:hover{background:var(--surface-2)}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.langsw{display:inline-flex;background:var(--surface);border-radius:999px;padding:3px;gap:2px;flex:none}
.langsw button{border:0;background:transparent;border-radius:999px;padding:5px 9px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;line-height:1;color:var(--muted)}
.langsw button:hover{background:var(--surface-2)}
.langsw button[aria-pressed="true"]{background:var(--lapis);color:var(--lapis-ink)}
.langsw button[aria-pressed="false"] .flag{opacity:.6}
.flag{width:21px;height:14px;border-radius:3px;display:block;flex:none;overflow:hidden}
.pill{white-space:nowrap}
@media (max-width:720px){
  .langsw .code{display:none}.langsw button{padding:5px 7px}
  header.top{flex-wrap:wrap;row-gap:10px}
  .top-right{display:contents}
  .top-meta{order:3;width:100%;justify-content:flex-start}
  .top-meta:empty{display:none}
}
.hidden,[hidden]{display:none!important}

/* setup */
.intro h1{font-family:var(--greek);font-size:clamp(30px,5vw,42px);line-height:1.1;margin:8px 0 8px;font-weight:700}
.intro p{color:var(--muted);margin:0 0 24px;max-width:62ch}
.credits{color:var(--muted);font-size:13px;line-height:1.5;margin:28px 0 0;max-width:72ch}
.credits a{color:inherit}
.block{background:var(--surface);border-radius:18px;padding:20px;margin-bottom:14px}
.block h2{font-size:16px;font-weight:700;margin:0 0 4px}
.block .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 16px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--lapis);color:var(--lapis-ink)}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.presets button{border:0;background:var(--surface-2);border-radius:9px;padding:7px 12px;font-size:14px;font-weight:600}
.presets button:hover{background:var(--surface-3)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.ch{border:0;background:var(--surface-2);border-radius:12px;padding:10px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.ch .n{font-size:20px;font-weight:700;line-height:1.1}
.ch .c{font-size:12px;color:var(--muted)}
.ch[aria-pressed="true"]{background:var(--lapis);color:var(--lapis-ink)}
.ch[aria-pressed="true"] .c{color:rgba(255,255,255,.8)}
.ch:disabled{opacity:.4;cursor:default}
.ch.wide{grid-column:span 2}
.secgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.secgrid .ch{align-items:flex-start;text-align:left;padding:10px 12px 9px;gap:3px;min-height:76px}
.secgrid .ch .k{font-size:12px;font-weight:700;color:var(--muted)}
.secgrid .ch .s{font-size:15px;font-weight:700;line-height:1.25}
.secgrid .ch .w{font-size:13px;font-weight:600;margin-top:auto}
.secgrid .ch .w+.c{font-size:11px;margin-top:-2px}
.secgrid .ch[aria-pressed="true"] .k{color:rgba(255,255,255,.8)}
.ch.lvl{box-shadow:inset 0 0 0 3px var(--gold)}
.ch .lv{font-size:11px;font-weight:700;color:var(--gold)}
.ch[aria-pressed="true"] .lv{color:var(--gold)}
.selwrap{position:relative;display:inline-block;max-width:100%}
.selwrap::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel{font:inherit;font-weight:600;font-size:15px;background:var(--surface-2);color:var(--ink);border:0;border-radius:12px;padding:12px 44px 12px 14px;max-width:100%;appearance:none;-webkit-appearance:none;cursor:pointer}
.modeext{margin-top:18px}
.modeext h3{font-size:15px;font-weight:700;margin:0 0 4px}
.modeext .sub{margin-bottom:12px}
.status{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.status p{margin:0;max-width:60ch}
.status .big{font-size:18px;font-weight:700}
.status .muted{color:var(--muted);font-size:14px}
.note{background:var(--gold-tint);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px}

/* quiz */
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:18px 20px 34px;text-align:center;position:relative;margin-bottom:14px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--hero-muted);font-size:14px;font-weight:600;text-align:left}
.hint{border:0;background:rgba(255,255,255,.1);color:var(--hero-ink);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.hint:hover{background:rgba(255,255,255,.18)}
.hint svg{width:16px;height:16px}
.form{font-family:var(--greek);font-size:clamp(52px,11vw,100px);line-height:1.15;margin:22px 0 4px;word-break:break-word}
.bd{margin:14px auto 10px;max-width:760px}
.bd-arrow{display:block;margin:0 auto 6px;width:18px;height:18px;color:var(--hero-muted)}
.segs{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:12px 6px}
.mseg{display:flex;flex-direction:column;align-items:stretch;min-width:46px;color:#fff;animation:pop .5s cubic-bezier(.2,.9,.3,1.25) both}
.mseg .lab{font-size:12px;font-weight:700;color:var(--hero-muted);text-align:center;white-space:nowrap;padding:0 2px 9px}
.mseg .br{height:10px;border:2px solid currentColor;border-bottom:0;border-radius:4px 4px 0 0;position:relative;opacity:.55;margin:0 3px}
.mseg .br::before{content:"";position:absolute;left:50%;top:-8px;width:2px;height:7px;background:currentColor;transform:translateX(-50%)}
.mseg .mo{font-family:var(--greek);font-size:34px;line-height:1.2;padding:3px 6px 0;text-align:center}
.mseg.t-stem{color:var(--hero-ink)}
.mseg.t-pre,.mseg.t-aug,.mseg.t-red{color:#C9D4F5}
.bd.nolab .mseg .lab{visibility:hidden}
.bd.still .mseg,.bd.still .plus{animation:none}
.bd.still .mseg .lab{animation:fade .4s both}
.plus{color:var(--hero-muted);font-size:22px;line-height:1;padding-bottom:12px;animation:fade .4s both}
.bdnotes{list-style:none;margin:16px auto 0;padding:14px 16px;max-width:600px;background:rgba(255,255,255,.07);border-radius:14px;color:#DCE3F8;font-size:14.5px;text-align:left;display:grid;gap:6px;animation:fade .5s .3s both}
.bdnotes li{padding-left:18px;position:relative}
.bdnotes li::before{content:"";position:absolute;left:3px;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--hero-ink)}
.bdnone{color:var(--hero-muted);font-size:14px;margin:6px 0 0}
@keyframes pop{from{opacity:0;transform:translateY(-22px) scale(.8)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:720px){.mseg .mo{font-size:26px}.mseg{min-width:38px}.mseg .lab{font-size:11px}}
.gloss{color:var(--hero-muted);font-size:15px;min-height:1.5em;max-width:56ch;margin:0 auto}
.gloss em{font-style:normal;color:#fff}
.gloss em.infl{display:block;font-size:20px;font-weight:600;line-height:1.35}
.gloss .base{display:block;font-size:13.5px;margin-top:4px}
.fields{display:grid;gap:12px;grid-template-columns:repeat(6,1fr)}
.field{background:var(--surface);border-radius:16px;padding:14px 14px 16px;grid-column:span 2;min-width:0}
.field.w3{grid-column:span 3}.field.w6{grid-column:span 6}.field.w4{grid-column:span 4}
.field h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--muted)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.opts.lex{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opt{hyphens:manual;overflow-wrap:break-word;border:0;background:var(--surface-2);border-radius:10px;padding:11px 8px;font-weight:600;font-size:15px;line-height:1.25;min-height:46px}
.opt small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
@media (hover:hover){.opt:hover:not(:disabled):not([aria-pressed="true"]){background:var(--surface-3)}}
.opt[aria-pressed="true"]{background:var(--lapis);color:var(--lapis-ink)}
.opt[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.opt.lone{background:var(--gold-tint);color:var(--ink);cursor:default}
.opt.greek{font-family:var(--greek);font-size:20px;font-weight:400}
.opt:disabled{cursor:default}
.opt.ok{background:var(--right)!important;color:#fff!important}
.opt.bad{background:var(--wrong)!important;color:#fff!important}
.opt.miss{background:var(--right-tint)!important;color:var(--right-ink)!important;box-shadow:inset 0 0 0 2px var(--right)}
.opt.ok small,.opt.bad small{color:rgba(255,255,255,.85)}
.fnote{font-size:12.5px;color:var(--muted);margin:8px 0 0}

.result{border-radius:18px;overflow:hidden;margin-top:14px;background:var(--surface)}
.result .head{padding:14px 20px;font-weight:700;font-size:18px;color:#fff;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.result.good .head{background:var(--right)} .result.badr .head{background:var(--wrong)}
.result .head span{font-weight:500;font-size:14px;opacity:.9}
.result .body{padding:16px 20px 20px;display:grid;gap:14px}
.parse{font-size:17px;font-weight:600}
.parse .also{display:block;font-weight:500;font-size:14px;color:var(--muted);margin-top:4px}
.entry{display:grid;gap:2px}
.entry .lx{font-family:var(--greek);font-size:22px}
.entry .pp{font-family:var(--greek);font-size:17px;color:var(--muted)}
.entry .m{color:var(--muted);font-size:15px}
.verse{background:var(--surface-2);border-radius:12px;padding:12px 16px}
.verse .ref{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.verse .txt{font-family:var(--greek);font-size:19px;line-height:1.6}
.verse mark{background:var(--gold);color:var(--gold-ink);border-radius:4px;padding:0 3px}

.actionbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.actionbar .in{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.kbd{color:var(--muted);font-size:14px}
kbd{font-family:var(--ui);background:var(--surface);border-radius:6px;padding:2px 7px;font-weight:600;color:var(--ink);font-size:13px}
.primary{border:0;background:var(--gold);color:var(--gold-ink);border-radius:12px;padding:14px 26px;font-weight:700;font-size:16px}
.primary:hover:not(:disabled){filter:brightness(1.05)}
.primary:disabled{opacity:.45;cursor:default}
.ghost{border:0;background:var(--surface);border-radius:12px;padding:14px 20px;font-weight:600}
.ghost:hover{background:var(--surface-2)}

/* summary */
.score{font-family:var(--greek);font-size:clamp(64px,14vw,120px);line-height:1;color:var(--hero-ink);margin:10px 0}
.misslist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.misslist li{background:var(--surface-2);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.misslist .g{font-family:var(--greek);font-size:22px;min-width:7ch}
.misslist .d{color:var(--muted);font-size:14px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

@media (max-width:720px){
  .fields{grid-template-columns:1fr}
  .field,.field.w2,.field.w3,.field.w4,.field.w6{grid-column:1/-1}
  .opts{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .opts.lex{grid-template-columns:1fr 1fr}
  .brand b{font-size:19px}
  .brand svg{width:30px;height:30px}
  .wrap{padding:14px 14px 120px}
  .kbd{display:none}
  .actionbar .in{justify-content:flex-end}
  .primary{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Mina sidor, nivåer och kapitel som fylls */
.lvlbar{max-width:560px;margin:4px auto 16px}
.mehero .lvlbar .mbar{max-width:none;margin:0;height:12px}
.lvlrow{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:14px}
.lvlrow b{color:var(--hero-ink)}
.stiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stile{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stile span{font-size:13px;color:var(--muted);font-weight:600}
.stile b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.rwbar{height:8px;border-radius:99px;background:var(--wrong);overflow:hidden;margin:12px 0 4px}
.rwbar i{display:block;height:100%;background:var(--right);border-right:2px solid var(--surface)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .cg{stroke:var(--surface-2);stroke-width:1}
.chart .cy,.chart .cx{fill:var(--muted);font-size:12px;font-family:inherit}
.chart .cy{text-anchor:end}.chart .cx{text-anchor:middle}
.chart .cl{fill:none;stroke:var(--lapis);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .cd{fill:var(--lapis);stroke:var(--surface);stroke-width:2}
.chart .ch-hit{fill:transparent}
.chart .cpt:hover .cd,.chart .cpt:focus .cd{r:6.5;fill:var(--gold)}
.chart .cpt:focus{outline:none}
@media (max-width:720px){.stile b{font-size:20px}.stiles{gap:6px}.stile{padding:10px}}
:root{--fillc:rgba(31,138,91,.22);--fillc-sel:rgba(46,190,115,.78)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fillc:rgba(47,168,114,.32);--fillc-sel:rgba(47,168,114,.80)}}
:root[data-theme="dark"]{--fillc:rgba(47,168,114,.32);--fillc-sel:rgba(47,168,114,.80)}
.ch{position:relative;overflow:hidden;isolation:isolate}
.ch::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--fill,0%);background:var(--fillc);z-index:-1;transition:height .6s ease}
.ch[aria-pressed="true"]::before{background:var(--fillc-sel)}
.ch.full{box-shadow:inset 0 0 0 2px var(--right)}
.ch.full.lvl{box-shadow:inset 0 0 0 3px var(--gold)}
.ch .rp{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--ink)}
.ch[aria-pressed="true"] .rp{color:var(--lapis-ink)}
.ch .rp svg,.reptag svg{width:12px;height:12px;flex:none}
.reptag{display:inline-flex;align-items:center;gap:5px;background:var(--gold-tint);color:var(--ink);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;font-weight:700;vertical-align:middle;white-space:nowrap}
.repblock h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.repblock .frow{grid-template-columns:minmax(110px,180px) 1fr auto}
.repblock .frow b{white-space:nowrap}
@media (prefers-reduced-motion:reduce){.ch::before{transition:none}}
.tpill{display:inline-flex;align-items:center;gap:8px;color:var(--ink)!important}
.mebtn{color:var(--ink)!important;font-weight:700}
.mebtn[aria-current="page"]{background:var(--lapis)!important;color:var(--lapis-ink)!important}
.tpill .tbar{width:44px;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:block}
.tpill .tbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.mehero{background:var(--hero);color:var(--hero-muted);text-align:center;padding:28px 20px}
.me-kick{margin:0;font-size:14px;font-weight:600}
.me-title{font-family:"Cinzel","Trajan Pro",Georgia,serif;color:var(--hero-ink);font-size:clamp(30px,6vw,44px);font-weight:800;margin:6px 0 10px;line-height:1.1}
.me-next{margin:0 auto 12px;max-width:52ch;font-size:15px}
.mehero .mbar{max-width:360px;margin:0 auto 14px;background:rgba(255,255,255,.14)}
.mehero .btnrow{justify-content:center}
.me-note{color:var(--hero-ink);font-size:14px;margin:8px 0 0}
.block .me-note{color:var(--muted)}
.mbar{display:block;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;flex:1}
.mbar i{display:block;height:100%;background:var(--right);border-radius:99px}
.mbar.mid i{background:var(--gold)} .mbar.low i{background:var(--wrong)} .mbar.gold i{background:var(--gold)}
.me-h3{font-size:14px;font-weight:700;margin:18px 0 8px;color:var(--muted)}
.frows{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:minmax(110px,180px) 1fr 48px;gap:12px;align-items:center;font-size:14.5px}
.frow b{text-align:right;font-variant-numeric:tabular-nums}
.clist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.clist li{background:var(--surface-2);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14.5px}
.clist li span{color:var(--muted)}
.flabel{display:block;font-weight:600;font-size:14px;color:var(--muted);margin:12px 0 6px}
.finput{width:100%;font:inherit;font-size:16px;padding:11px 13px;border-radius:12px;border:0;background:var(--surface-2);color:var(--ink);resize:vertical}
.fcount{margin:4px 0 0;text-align:right;font-size:13px;color:var(--muted)}
.fcheck{display:flex;gap:8px;align-items:flex-start;margin:14px 0 4px;font-size:14.5px}
.fcheck input{width:18px;height:18px;accent-color:var(--gold);margin-top:2px;flex:none}
.me-ok{align-self:center;font-size:14px;color:var(--right);font-weight:600}
.me-err{color:var(--wrong);font-size:14px;font-weight:600;margin:8px 0 0}
.me-err:empty{display:none}
.acc-row{margin-top:18px}
.ghost.danger{color:var(--wrong)}
.block .ghost{background:var(--surface-2)}
.block .ghost:hover{background:var(--surface-3)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(9,14,33,.62);display:grid;place-items:center;padding:20px}
.mcard{background:var(--hero);color:var(--hero-muted);border-radius:22px;padding:30px 26px 24px;max-width:420px;width:100%;text-align:center;animation:pop .5s cubic-bezier(.2,.9,.3,1.25) both}
.mcard svg{width:64px;height:64px;display:block;margin:0 auto 10px}
.mcard .mk{margin:0;font-weight:700;font-size:14px;color:var(--hero-ink)}
.mcard h2{font-family:"Cinzel","Trajan Pro",Georgia,serif;font-size:34px;color:#fff;margin:6px 0 10px;line-height:1.1}
.mcard p{margin:0 0 20px;font-size:15.5px}
.mcard .primary{width:100%}
@media (max-width:720px){.frow{grid-template-columns:minmax(90px,130px) 1fr 44px}}
/* guiden: en guldram runt det som visas och ett kort med Fortsätt */
.tour-ring{position:fixed;z-index:60;border:3px solid var(--gold);border-radius:18px;pointer-events:none;transition:top .2s,left .2s,width .2s,height .2s}
.tour-card{position:fixed;z-index:61;background:var(--gold);color:var(--gold-ink);border-radius:18px;padding:16px 18px 14px;width:min(390px,calc(100vw - 32px));animation:fade .25s both}
.tour-card .tk{margin:0;font-size:12.5px;font-weight:700;opacity:.7}
.tour-card h3{font-size:17px;margin:4px 0 6px}
.tour-card p.tt{margin:0 0 14px;font-size:14.5px;line-height:1.45}
.tour-card .tprev{margin:0 0 14px;background:var(--hero);color:var(--hero-ink);border-radius:12px;padding:8px 8px 10px;overflow:hidden}
.tour-card .tprev .bd{margin:2px auto 0}
.tour-card .tprev .segs{flex-wrap:nowrap;gap:3px}
.tour-card .tprev .mseg{min-width:0;flex:none}
.tour-card .tprev .mseg .mo{font-size:24px;padding:2px 3px 0}
.tour-card .tprev .mseg .lab{font-size:10.5px;padding-bottom:6px}
.tour-card .tprev .mseg .br{height:7px}
.tour-card .tprev .plus{font-size:15px;padding-bottom:7px}
.tour-card .tbtn{text-decoration:underline;text-decoration-color:var(--lapis);text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}
.tour-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tour-card .tour-go{background:var(--hero);color:#fff}
.tour-skip{background:none;border:0;color:var(--gold-ink);font-size:14px;text-decoration:underline;padding:6px 0}
.tourlink{text-align:center;margin:4px 0 10px}
.demonote{background:var(--gold-tint);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14.5px;margin:12px 0 0}
.tourlink button{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.tour-ring{transition:none}.tour-card{animation:none}}
</style>

  ['pa','presens aktiv','present active',[16]],

  ['impf','imperfekt','imperfect',[21]],

  ['a1','aorist 1 aktiv/medium','first aorist active/middle',[22]],
  ['a2','aorist 2 aktiv/medium','second aorist active/middle',[22]],
  ['pass','aorist och futurum passiv','aorist and future passive',[24]],
  ['pf','perfekt och pluskvamperfekt','perfect and pluperfect',[25]],

function declOf(w){
  const g=norm((w.w.split(',')[1]||'').trim().replace(/^-/,'')),h=norm(w.h);
  if(!g||/^(ο|η|το|οι|αι|τα)$/.test(g)) return '';
  if(/ου$/.test(g)) return /(ης|ας)$/.test(h)?'d1':'d2';
  if(/(ης|ας|α|η)$/.test(g)) return 'd1';
  if(/ω$/.test(g)) return 'd2';
  return 'd3';
}
const isContract=w=>/(εω|αω|οω|εομαι|αομαι|οομαι)$/.test(norm(w.h));
/* andra aoristen: avgörs av principalformen för aorist, annars av formens ändelse */
function isAor2(w,f){
  const pp=(w.pp||'').replace(/^\([^)]*\),?\s*/,'').split(',').map(s=>s.trim()),aor=pp[1]||'';
  const fn=norm(f.f);
  if(aor&&aor!=='–'){
    const alts=aor.split(/\s+or\s+/).map(a=>norm(a.trim()));
    const a1=alts.filter(a=>/(α|αμην)$/.test(a)),a2=alts.filter(a=>!/(α|αμην)$/.test(a));
    if(!a2.length) return false;
    if(!a1.length) return true;
    // två aoristformer (ἔστην och ἔστησα): välj den vars stam passar formen bäst, lika = andra aorist
    const stem=a=>a.replace(/(αμην|ομην|α|ον|ην|ων|ν)$/,'');
    const best=l=>Math.max(...l.map(a=>fn.includes(stem(a))?stem(a).length:0));

function secOf(w,f,c){

  for(let i=0;i<3;i++){const a=chs[Math.floor(i*n/3)],z=chs[Math.floor((i+1)*n/3)-1];if(a!=null&&z!=null&&a<=z)parts.push([a,z])}

  P.innerHTML=`<button data-p="all">${tx('all')}</button>`+parts.map(([a,z])=>`<button data-p="${a}-${z}">${tx('chRange',a,z)}</button>`).join('')+`<button data-p="none">${tx('clear')}</button>`;

/* ---------- session ---------- */
let sess=null,q=null;
function startSession(retry,opt){if(!Array.isArray(retry))retry=null;opt=opt||{};
  const pool=opt.king?kingPool():buildPool();
  if(!pool.length&&!retry) return;
  sess={pool,M:opt.king?new Set(MOMENTS.map(m=>m[0])):opt.M||momentSet(),total:opt.king?KING_LEN:retry?retry.length:S.len,i:0,correct:0,answered:0,misses:[],used:new Set(),retry:retry?[...retry]:null,king:!!opt.king,rep:opt.rep||null};
  if(retry&&!pool.length) sess.pool=kingPool();
  show('quiz');nextQuestion();
}
function pickForm(){
  if(sess.retry){return sess.retry.shift()}
  for(let k=0;k<80;k++){
    const p=sess.pool[Math.floor(Math.random()*sess.pool.length)];
    const f=p.fs[Math.floor(Math.random()*p.fs.length)];
    if(!sess.used.has(f.i)||k>60){sess.used.add(f.i);return f}
  }
  return sess.pool[0].fs[0];
}
function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f\u1fbd\u1fbf\u1ffe]/g,'').toLowerCase()}
function distractors(word){
  const pool=sess.pool.map(p=>p.w).filter(w=>w.t===word.t),maxCh=autoLevel();
  const seen=new Set([norm(word.h)]),out=[];
  const tryAdd=list=>{shuffle(list).forEach(w=>{if(out.length<3&&!seen.has(norm(w.h))){seen.add(norm(w.h));out.push(w)}})};
  // prefer look-alikes: same first letter
  const first=norm(word.h)[0];
  tryAdd(pool.filter(w=>norm(w.h)[0]===first));
  tryAdd(pool);
  tryAdd(W.filter(w=>w.t===word.t&&w.ch<=maxCh));
  tryAdd(W.filter(w=>w.t===word.t));
  return shuffle([word,...out]);
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function nextQuestion(){
  if(sess.total&&sess.i>=sess.total){return renderSummary()}
  let f=pickForm();
  // första gången: välj helst en form med många delar, så att guiden kan visa uppdelningen
  if(sess.i===0&&!sess.king&&!sess.retry&&!tourSeen('quiz')){
    const parts=x=>{const m=FA[x.i],w=W[x.w];const c=m&&x.codes.find(c=>m[c]!==undefined&&learned(w.t,c,sess.M));return c?AN[m[c]][0].length:0};
    let best=parts(f);
    for(let k=0;k<60&&best<4;k++){const g=pickForm(),n=parts(g);if(n>best){best=n;f=g}}
  }
  const word=W[f.w];
  const acc=f.codes.filter(c=>learned(word.t,c,sess.M));
  q={f,word,acc:acc.length?acc:f.codes,sel:{},checked:false,hint:0,lex:distractors(word),opts:availOpts(word.t,sess.M)};
  // preselect single-option fields
  ['tense','voice','mood','case'].forEach(k=>{if(q.opts[k]&&q.opts[k].length===1&&fieldsFor().includes(k))q.sel[k]=q.opts[k]});
  sess.i++;
  renderQuiz();
  if(sess.i===1&&!sess.king) setTimeout(quizTour,250);
}
function fieldsFor(moodOverride){
  if(q.word.t==='N') return ['case','number','gender','lex'];
  const m=moodOverride!==undefined?moodOverride:q.sel.mood;
  if(m==='P') return ['tense','voice','mood','case','number','gender','lex'];
  if(m==='N') return ['tense','voice','mood','lex'];
  return ['tense','voice','mood','person','number','lex'];
}
function codeOf(sel,t){
  if(t==='N') return (sel.case||'?')+(sel.number||'?')+(sel.gender||'?');
  const b=(sel.tense||'?')+(sel.voice||'?')+(sel.mood||'?');
  if(sel.mood==='N') return b;
  if(sel.mood==='P') return b+(sel.case||'?')+(sel.number||'?')+(sel.gender||'?');
  return b+(sel.person||'?')+(sel.number||'?');
}
function decode(code,t){
  if(t==='N') return {case:code[0],number:code[1],gender:code[2]};
  const o={tense:code[0],voice:code[1],mood:code[2]};
  if(o.mood==='P'){o.case=code[3];o.number=code[4];o.gender=code[5]}
  else if(o.mood!=='N'){o.person=code[3];o.number=code[4]}
  return o;
}
function describe(code,t){
  const o=decode(code,t),lc=s=>s.toLowerCase();
  if(t==='N') return `${L.case[o.case]} ${lc(L.number[o.number])} ${lc(L.gender[o.gender])}`;
  const voice=o.voice==='M'?lc(L.voice.M.split(' /')[0]):lc(L.voice[o.voice]);
  let s=`${L.tense[o.tense]} ${voice} ${lc(L.mood[o.mood])}`;
  if(o.mood==='P') s+=`, ${lc(L.case[o.case])} ${lc(L.number[o.number])} ${lc(L.gender[o.gender])}`;
  else if(o.mood!=='N') s+=`, ${L.person[o.person]} ${lc(L.number[o.number])}`;
  return s;
}

function renderQuiz(){
  const {f,word}=q;
  $('barFill').style.width=sess.total?((sess.i-1)/sess.total*100)+'%':'0%';
  const kind=tx(word.t==='N'?'kindN':'kindV');
  $('qCount').innerHTML=esc(sess.total?tx('count',kind,sess.i,sess.total):tx('countFree',kind,sess.i))+(sess.rep&&sess.rep.has(f.i)?' '+repTag():'');
  $('qForm').textContent=f.f;
  const hk=hintCode();
  $('qBreak').innerHTML=q.checked?breakdownHTML(q.best,'full'):(q.hint&&hk?breakdownHTML(hk,q.hint>1?'labels':'split'):'');
  const tr=q.checked?inflTr(word,q.best):null;
  $('qGloss').innerHTML=tr?`<em class="infl">${esc(tr)}</em><span class="base">${tx('baseMeaning')}${esc(word.m)}</span>`:(q.hint||q.checked?`<em>${esc(word.m)}</em>`:'');
  $('hintBtn').classList.toggle('hidden',q.checked||q.hint>1||!hk||sess.king);
  $('hintLbl').textContent=tx(q.hint?'showLabels':'splitWord');
  renderFields();
  $('resultBox').innerHTML='';
  if(q.checked) renderResult();
  setTop('quiz');
  if(q.checked) setActions([{label:tx(sess.total&&sess.i>=sess.total?'showRes':'next'),primary:true,fn:nextQuestion}],tx('nextHint'));
  else setActions([{label:tx('checkBtn'),primary:true,fn:check}],tx('checkHint'));

}
/* mode: 'full' efter kontroll, 'split' bara delarna, 'labels' delarna med etiketter. */
function breakdownHTML(code,mode){
  const m=FA[q.f.i],ix=m?m[code]:undefined;
  if(ix===undefined){
    const part=q.word.t==='V'&&code[2]==='P';
    return `<p class="bdnone">${tx(part?'noPart':'irregular')}</p>`;
  }
  const [ms,notes]=AN[ix];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cls=mode==='split'?' nolab':mode==='labels'?' still':'';
  let h=`<div class="bd${cls}"><div class="segs" aria-label="${tx('parts')}">`;
  ms.forEach(([t,x],i)=>{
    const lab=t==='end'?(q.word.t==='N'?L.morph.endN:L.morph.end):L.morph[t];
    const dl=reduce?0:120+i*110;
    if(i) h+=`<span class="plus" style="animation-delay:${dl-60}ms" aria-hidden="true">+</span>`;
    h+=`<div class="mseg t-${t}" style="animation-delay:${dl}ms"><span class="lab">${lab}</span><span class="br"></span><span class="mo" lang="grc">${esc(x||'–')}</span></div>`;
  });
  h+='</div>';
  if(mode==='full'&&notes.length) h+=`<ul class="bdnotes">${notes.map(n=>`<li>${esc(noteText(n))}</li>`).join('')}</ul>`;
  return h+'</div>';
}

stand:understood:understood wake:woke:woken wear:wore:worn weave:wove:woven weep:wept:wept win:won:won wind:wound:wound withdraw:withdrew:withdrawn withhold:withheld:withheld withstand:withstood:withstood write:wrote:written').split(' ').forEach(x=>{const [a,b,c]=x.split(':');o[a]=[b,c]});return o})();
const STATIVE=new Set(['be','have','know','want','wish','need','belong','own','possess','seem','resemble']);
const vow=c=>'aeiou'.includes(c);
const DBL2=new Set(['admit','commit','emit','omit','permit','submit','transmit','acquit','compel','dispel','expel','propel','repel','rebel','confer','defer','infer','prefer','refer','transfer','deter','occur','incur','recur','regret','control','patrol','equip','abhor','annul']);
function dbl(v){ // stop -> stopp, permit -> permitt
  if(DBL2.has(v)) return v+v.slice(-1);
  const m=v.match(/^[^aeiou]*[aeiou][^aeiouwxy]$/);
  return m?v+v.slice(-1):v;
}
function engPast(v){
  if(IRR[v]) return IRR[v][0];
  if(v.endsWith('e')) return v+'d';
  if(/[^aeiou]y$/.test(v)) return v.slice(0,-1)+'ied';
  return dbl(v)+'ed';
}
function engPP(v){ if(IRR[v]) return IRR[v][1]; return engPast(v)}
function engIng(v){
  if(v==='be') return 'being';
  if(v.endsWith('ie')) return v.slice(0,-2)+'ying';
  if(v.endsWith('e')&&!/(ee|ye|oe)$/.test(v)) return v.slice(0,-1)+'ing';
  return dbl(v)+'ing';
}
function engS3(v){
  if(v==='be') return 'is'; if(v==='have') return 'has'; if(v==='do') return 'does'; if(v==='go') return 'goes';
  if(/(s|x|z|ch|sh|o)$/.test(v)) return v+'es';
  if(/[^aeiou]y$/.test(v)) return v.slice(0,-1)+'ies';
  return v+'s';
}
const SUBJ={'1S':'I','2S':'you (sg.)','3S':'he/she/it','1P':'we','2P':'you (pl.)','3P':'they'};
function firstSense(m,num){
  let s=m.replace(/\([^)]*\)/g,' ').replace(/\[[^\]]*\]/g,' ');
  const sg=s.match(/sg\.?:\s*([^;]+)/i),pl=s.match(/pl\.?:\s*([^;]+)/i);
  if(num==='P'&&pl) s=pl[1]; else if(sg) s=sg[1];
  s=s.split(/[;,]/)[0].replace(/\s+/g,' ').trim();
  return s;
}
function pickVoice(m,voice){
  const seg={};m.split(';').forEach(p=>{const k=p.match(/^\s*(active|middle|passive|intrans|trans|noun)\.?:\s*(.*)$/i);if(k)seg[k[1].toLowerCase()]=k[2]});
  if(!Object.keys(seg).length) return m;
  if(voice==='P') return seg.passive||seg.middle||seg.active||seg.intrans||m;
  if(voice==='M') return seg.middle||seg.active||seg.intrans||m;
  return seg.active||seg.intrans||seg.noun||m;
}
function verbBase(m){
  const s=firstSense(m);
  const g=s.match(/^(?:I|to)\s+(.+)$/); if(!g) return null;
  let w=g[1].split(' '),v=w[0].toLowerCase(),rest=w.slice(1).join(' ');
  if(v==='am') v='be';
  if(!/^[a-z]+$/.test(v)) return null;
  return {v,rest:rest?' '+rest:''};
}
function verbTr(word,code){
  const t=code[0],m=code[2];
  const segd=pickVoice(word.m,code[1]),hasSeg=segd!==word.m;
  const b=verbBase(segd); if(!b) return null;
  const {v,rest}=b;
  const dep=/μαι$/.test(word.h);
  const pass=(code[1]==='P'||(code[1]==='M'&&'PIXY'.includes(t)&&!/μαι$/.test(word.h)&&!(hasSeg&&/middle:/i.test(word.m))))&&!dep&&v!=='be'&&!(hasSeg&&/(passive|middle):/i.test(word.m));
  const pp=engPP(v)+rest;
  const be=(pn,tense)=>{
    if(tense==='pres') return {'1S':'am','3S':'is'}[pn]||'are';
    return (pn==='1S'||pn==='3S')?'was':'were';
  };
  if(m==='N'){
    if(pass) return 'to '+(t==='X'?'have been ':'be ')+pp;
    if(t==='X') return 'to have '+pp;
    if(t==='F') return 'to be going to '+v+rest;
    return 'to '+v+rest;
  }
  if(m==='P'){
    if(pass) return (t==='P'?'being ':'having been ')+pp;
    if(t==='P') return engIng(v)+rest;
    return 'having '+pp;
  }
  const pn=code.slice(3,5),S=SUBJ[pn],s3=pn==='3S';
  if(m==='D'){
    const core=pass?'be '+pp:v+rest;
    if(pn[0]==='3') return `let ${pn==='3S'?'him/her/it':'them'} ${core}!`;
    return core+'!'+(pn==='2P'?' (pl.)':'');
  }
  if(m==='S') return `${S} might ${pass?'be '+pp:v+rest}`;
  // indicative
  let vp;
  if(t==='P'){
    if(pass) vp=be(pn,'pres')+' being '+pp;
    else if(v==='be') vp=be(pn,'pres')+rest;
    else vp=(s3?engS3(v):v)+rest;
  } else if(t==='I'){
    if(pass) vp=be(pn,'past')+' being '+pp;
    else if(v==='be') vp=be(pn,'past')+rest;
    else if(STATIVE.has(v)) vp=engPast(v)+rest;
    else vp=be(pn,'past')+' '+engIng(v)+rest;
  } else if(t==='F') vp='will '+(pass?'be '+pp:v+rest);
  else if(t==='A') vp=pass?be(pn,'past')+' '+pp:(v==='be'?be(pn,'past'):engPast(v))+rest;
  else if(t==='X') vp=(s3?'has':'have')+(pass?' been ':' ')+pp;
  else if(t==='Y') vp='had'+(pass?' been ':' ')+pp;
  return S+' '+vp;
}
const NIRR={man:'men',woman:'women',child:'children',foot:'feet',tooth:'teeth',sheep:'sheep',fish:'fish',ox:'oxen',mouse:'mice',person:'people',leaf:'leaves',life:'lives',wife:'wives',knife:'knives',thief:'thieves',loaf:'loaves',wolf:'wolves',half:'halves',shelf:'shelves',calf:'calves',goose:'geese',people:'people',heaven:'heavens'};
function engPl(n){
  const w=n.split(' '),l=w.pop().toLowerCase();
  let p=NIRR[l]||(/(s|x|z|ch|sh)$/.test(l)?l+'es':/[^aeiou]y$/.test(l)?l.slice(0,-1)+'ies':l+'s');
  return [...w,p].join(' ');
}
function nounTr(word,code){
  let s=firstSense(pickVoice(word.m,'A'),code[1]);
  if(!s||/[^A-Za-z '\-]/.test(s)) return null;
  const proper=/^[A-Z]/.test(s);
  s=s.replace(/^(a|an|the)\s+/i,'');
  const n=code[1]==='P'&&!proper&&!/^the\s/i.test(firstSense(word.m,'P'))&&!(/pl\.?:/i.test(word.m))?engPl(s):s;
  const np=proper?n:'the '+n;
  switch(code[0]){
    case 'N': return np+' ('+tx('subj')+')';
    case 'G': return 'of '+np;
    case 'D': return 'to/for '+np;
    case 'A': return np+' ('+tx('obj')+')';
    case 'V': return 'O '+n+'!';
  }
  return null;
}
function inflTr(word,code){try{return word.t==='N'?nounTr(word,code):verbTr(word,code)}catch(e){return null}}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

    if(k==='voice'&&q.opts.voice.length===1){const n=document.createElement('p');n.className='fnote';const c=firstCh([18,24]);n.textContent=c?tx('voiceNote',c):tx('voiceNoteF');el.appendChild(n)}
    if(k==='case'&&t==='N'&&q.opts.case.length===2){const n=document.createElement('p');n.className='fnote';const c=momCh(7);n.textContent=c?tx('caseNote',c):tx('caseNoteF');el.appendChild(n)}

function optBtn(k,v,label,sub,greek,lone){
  const b=document.createElement('button');
  b.className='opt'+(greek?' greek':'')+(lone&&!q.checked?' lone':'');
  if(greek) b.lang='grc';
  b.innerHTML=esc(label)+(sub?`<small>${esc(sub)}</small>`:'');
  const val=k==='lex'?v:v;
  const selected=q.sel[k]===val;
  if(q.checked){
    b.disabled=true;
    const right=k==='lex'?val===q.word.i:decode(q.best,q.word.t)[k]===val;
    if(selected&&right)b.classList.add('ok');
    else if(selected)b.classList.add('bad');
    else if(right)b.classList.add('miss');
  } else {
    b.setAttribute('aria-pressed',selected);
    if(lone) b.disabled=false;
    b.onclick=()=>{
      if(lone) return;
      q.sel[k]=selected?undefined:val;
      if(k==='mood'){ // reset fields that no longer apply
        const keep=fieldsFor();Object.keys(q.sel).forEach(x=>{if(!keep.includes(x))delete q.sel[x]});
      }
      renderFields();
    };
  }
  return b;
}

function check(){
  if(q.checked) return;
  const t=q.word.t;
  const flds=fieldsFor().filter(k=>k!=='lex');
  // find accepted parse closest to the answer
  let best=q.acc[0],bs=-1;
  q.acc.forEach(c=>{const d=decode(c,t);let s=0;Object.keys(d).forEach(k=>{if(q.sel[k]===d[k])s++});if(s>bs){bs=s;best=c}});
  q.best=best;
  const code=codeOf(q.sel,t);
  q.parseOK=q.acc.includes(code);
  q.lexOK=q.sel.lex===q.word.i;
  q.ok=q.parseOK&&q.lexOK;
  q.checked=true;
  sess.answered++;life.a++;
  if(q.ok){sess.correct++;life.c++}else sess.misses.push(q.f);
  saveLife();

const FKEY={};F.forEach(f=>{FKEY[f.f+'|'+W[f.w].h]=f});
const TITLES=[['Bonde','Farmer'],['Fiskare','Fisherman'],['Herde','Shepherd'],['Köpman','Merchant'],['Tullindrivare','Tax collector'],['Lärling','Apprentice'],['Lärjunge','Disciple'],['Skrivare','Scribe'],['Lärare','Teacher'],['Författare','Author'],['Talare','Orator'],['Filosof','Philosopher'],['Äldste','Elder'],['Ståthållare','Governor'],['Senator','Senator'],['Prins','Prince'],['King of Parsing','King of Parsing']];
const KING=16,NEED=20,PASS=16,KING_LEN=50; // en titel per sektion: minst 16 rätt av de senaste 20 formerna utan ledtråd

/* sektionen för ett sparat svar, eller -1 om formen inte finns i datan */
function rowSec(r){const f=rowForm(r);return f?secOf(W[f.w],f,r.expected):-1}
/* per sektion: de senaste formerna utan ledtråd. Räknas ur svaren, så framstegen gäller i båda lägena. */
function sectionStats(){
  const by=SECTIONS.map(()=>[]);

    const r=HIST[i];if(r.hint) continue;
    const k=rowSec(r);if(k<0) continue;

}
/* nivån: den sparade nivån och sedan en sektion i taget så länge nästa är behärskad. En klarad sektion förblir klarad. */
function computedTitle(st){let t=Math.min(+PROF.title||0,st.length);while(t<st.length&&st[t].ok)t++;return t}
/* klarade sektioner där de senaste svaren har sjunkit under kravet: lärt men på väg att glömmas */
function repSecs(st){st=st||sectionStats();const out=[],t=Math.min(currentTitle(),st.length);for(let i=0;i<t;i++)if(!st[i].ok)out.push(i);return out}
const REP_ICON='<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M13.2 6.2A5.4 5.4 0 0 0 3.1 5M2.8 9.8A5.4 5.4 0 0 0 12.9 11M3 2.2V5h2.8M13 13.8V11h-2.8"/></svg>';
const repTag=()=>`<span class="reptag">${REP_ICON}${tx('repTag')}</span>`;
/* former att repetera ur de klarade sektionerna, högst n stycken */
function repForms(secs,n){const seen=new Set();return shuffle(secs.flatMap(k=>sectionForms(k))).filter(f=>!seen.has(f.i)&&seen.add(f.i)).slice(0,n)}
function currentTitle(){return PROF.king_at?KING:Math.max(+PROF.title||0,computedTitle(sectionStats()))}

/* ord som räknas som inlärda: de två senaste svaren rätt och det senaste utan ledtråd */
function wordMastery(){
  const last={},out={};
  for(let i=HIST.length-1;i>=0;i--){const r=HIST[i],a=last[r.lemma]||(last[r.lemma]=[]);if(a.length<2)a.push(r)}
  Object.entries(last).forEach(([l,a])=>{out[l]=a.length>=2&&a.every(r=>r.ok)&&!a[0].hint});
  return out;
}

/* fenomen i en form, från sprängskissens delar och förklaringar */
const PHEN=[['contract','Kontraherade verb','Contract verbs'],['liquid','Likvida verb','Liquid verbs'],['compound','Sammansatta verb','Compound verbs'],['temporal','Temporalt augment','Temporal augment'],['redup','Reduplikation','Reduplication'],['sigma','Konsonant + σ (ψ, ξ)','Consonant + σ (ψ, ξ)'],['theta','Konsonant + θ','Consonant + θ'],['d1','Första deklinationen','First declension'],['d2','Andra deklinationen','Second declension'],['d3','Tredje deklinationen','Third declension']];
const phenName=k=>{const p=PHEN.find(x=>x[0]===k);return p?p[LANG==='en'?2:1]:k};
function phenOf(f,code){
  const w=W[f.w],out=new Set();
  if(w.t==='N'){
    const g=norm((w.w.split(',')[1]||'').trim().replace(/^-/,'')),h=norm(w.h);
    if(g) out.add(g==='ου'?(/(ης|ας)$/.test(h)?'d1':'d2'):/^(ης|ας)$/.test(g)?'d1':'d3');
    return [...out];
  }
  if(/(εω|αω|οω)$/.test(norm(w.h))) out.add('contract');
  const m=FA[f.i],ix=m?m[code]:undefined;
  if(ix!==undefined){
    const [ms,notes]=AN[ix],types=ms.map(x=>x[0]);
    if(types.includes('pre')) out.add('compound');
    if(types.includes('red')) out.add('redup');
    notes.forEach(n=>{const s=NT[n][0];
      if(/Kontraktion/.test(s)) out.add('contract');
      if(/Likvida/.test(s)) out.add('liquid');
      if(/temporalt augment|augmentet syns inte/.test(s)) out.add('temporal');
      if(/\+ σ skrivs|före σ/.test(s)) out.add('sigma');
      if(/\+ θ blir|före θ/.test(s)) out.add('theta');
    });
  }
  return [...out];
}
function weakness(){
  const fields={},phen={},conf={},miss=new Map();
  HIST.slice(-800).forEach(r=>{
    const f=rowForm(r);if(!f) return;
    const t=W[f.w].t,e=decode(r.expected,t),a=r.answer?decode(r.answer,t):{};
    Object.keys(e).forEach(k=>{
      const fv=fields[k]||(fields[k]={n:0,c:0,v:{}}),vv=fv.v[e[k]]||(fv.v[e[k]]={n:0,c:0}),ok=a[k]===e[k];
      fv.n++;vv.n++;if(ok){fv.c++;vv.c++}
      else if(a[k]&&L[k]&&L[k][a[k]]){const ck=k+':'+e[k]+':'+a[k];conf[ck]=(conf[ck]||0)+1}
    });
    phenOf(f,r.expected).forEach(p=>{const x=phen[p]||(phen[p]={n:0,c:0});x.n++;if(r.parse_ok)x.c++});
    if(r.ok) miss.delete(f.i);else miss.set(f.i,f);
  });
  return {fields,phen,conf,miss};
}
function weakForms(){
  const pool=buildPool(),M=momentSet(),wk=weakness(),cand=[];
  pool.forEach(p=>p.fs.forEach(f=>{
    const code=f.codes.find(c=>learned(p.w.t,c,M));if(!code) return;
    let s=Math.random();
    if(wk.miss.has(f.i)) s+=4;
    phenOf(f,code).forEach(k=>{const x=wk.phen[k];if(x&&x.n>=5) s+=(1-x.c/x.n)*5});
    const e=decode(code,p.w.t);
    Object.keys(e).forEach(k=>{const v=wk.fields[k]&&wk.fields[k].v[e[k]];if(v&&v.n>=5) s+=(1-v.c/v.n)*3});
    cand.push([s,f]);
  }));
  cand.sort((a,b)=>b[0]-a[0]);
  return shuffle(cand.slice(0,60).map(x=>x[1])).slice(0,S.len||20);
}
/* former i en sektion, ur hela ordförrådet, med grammatiken t.o.m. sektionen */
function sectionForms(k){
  const M=secMoments(k),out=[];
  W.forEach(w=>(byWord[w.i]||[]).forEach(f=>{if(f.codes.some(c=>secOf(w,f,c)===k&&learned(w.t,c,M))) out.push(f)}));
  return shuffle(out).slice(0,S.len||20);
}
function kingPool(){
  const M=new Set(MOMENTS.map(m=>m[0])),ws=[];
  W.forEach(w=>{const fs=(byWord[w.i]||[]).filter(f=>f.codes.some(c=>learned(w.t,c,M)));if(fs.length)ws.push({w,fs})});
  return ws;
}

    const misses=[];for(let i=HIST.length-1;i>=0&&misses.length<8;i--){const r=HIST[i];if(!r.ok&&rowForm(r)&&!misses.some(m=>m.r.form===r.form&&m.r.lemma===r.lemma))misses.push({r,f:rowForm(r)})}
    h+=`<h3 class="me-h3">${tx('missH2')}</h3>`;
    h+=misses.length?`<ul class="misslist">${misses.map(({r,f})=>{const t2=W[f.w].t;return `<li><span class="g" lang="grc">${esc(r.form)}</span><span class="d">${tx('rightIs')} ${esc(describe(r.expected,t2))}${r.answer&&!r.answer.includes('?')&&!r.parse_ok?`<br>${tx('youSaid')} ${esc(describe(r.answer,t2))}`:''}${!r.lex_ok?`<br>${tx('lexWas')} <span lang="grc" style="font-family:var(--greek);font-size:17px;color:var(--ink)">${esc(W[f.w].h)}</span>`:''}</span></li>`}).join('')}</ul><div class="btnrow"><button class="ghost" id="missBtn">${tx('practiceThese')}</button></div>`:`<p class="sub" style="margin:0">${tx('missNone')}</p>`;
    var MISSES=misses.map(m=>m.f);
  }
  h+=`</section>`;
  // kurs (inte för demokontot)
  if(!DEMO) h+=`<section class="block"><h2>${tx('courseH')}</h2><p class="sub">${tx('courseSub')}</p>
    <label class="flabel" for="pSchool">${tx('school')}</label><input class="finput" id="pSchool" maxlength="120" value="${esc(PROF.school||'')}">
    <label class="flabel" for="pCourse">${tx('course')}</label><input class="finput" id="pCourse" maxlength="120" value="${esc(PROF.course||'')}">
    <div class="btnrow"><button class="ghost" id="pSave">${tx('saveBtn')}</button><span class="me-ok" id="pOk"></span></div></section>`;
  // tyck till
  h+=`<section class="block"><h2>${tx('fbH')}</h2><p class="sub">${tx('fbSub')}</p>
    <label class="flabel" for="fbText">${tx('fbText')}</label><textarea class="finput" id="fbText" maxlength="200" rows="3"></textarea><p class="fcount" id="fbCount">0/200</p>
    <label class="flabel" for="fbName">${tx('fbName')}</label><input class="finput" id="fbName" maxlength="60">
    <label class="fcheck"><input type="checkbox" id="fbQuote"> <span>${tx('fbQuote')}</span></label>
    <div class="btnrow"><button class="ghost" id="fbSend">${tx('fbSend')}</button><span class="me-ok" id="fbOk"></span></div></section>`;
  // konto; demokontot får i stället en uppmaning att skapa ett eget konto
  if(DEMO) h+=`<section class="block"><h2>${tx('demoH')}</h2><p class="sub">${tx('demoText')}</p>
    <div class="btnrow"><button class="primary" id="demoUp">${tx('demoUp')}</button><button class="ghost" id="aOut">${tx('logout')}</button></div></section>`;
  else h+=`<section class="block"><h2>${tx('accH')}</h2><p class="sub">${tx('loggedAs',esc(KOP.email||''))}</p>
    <input type="email" autocomplete="username" value="${esc(KOP.email||'')}" hidden>
    <label class="flabel" for="aPw">${tx('newPwL')}</label><input class="finput" id="aPw" type="password" autocomplete="new-password" minlength="8">
    <div class="btnrow"><button class="ghost" id="aPwBtn">${tx('changePw')}</button><span class="me-ok" id="aPwOk"></span></div>
    <div class="btnrow acc-row"><button class="ghost" id="aOut">${tx('logout')}</button><button class="ghost danger" id="aDel">${tx('deleteAcc')}</button></div><p class="me-err" id="aErr"></p></section>`;
  box.innerHTML=h;
  setTop('me');
  setActions([{label:tx('backHome'),primary:true,fn:()=>{show('setup');renderSetup()}}],'');
  const start=(list,note)=>{if(list.length) startSession(list);else{const n=$(note);n.textContent=tx(FREE()?'noPracticeSec':'noPractice');n.hidden=false}};
  if($('nextBtn')) $('nextBtn').onclick=()=>{const l=sectionForms(sec);if(l.length) startSession(l,{M:secMoments(sec)});else{const n=$('nextNote');n.textContent=tx('noPractice');n.hidden=false}};
  if($('kingBtn')) $('kingBtn').onclick=()=>startSession(null,{king:true});
  // repetitionsformerna övas med grammatiken t.o.m. den högsta sektionen som repeteras
  const repM=extra=>{const M=new Set(extra||[]);if(REP.length)secMoments(Math.max(...REP)).forEach(x=>M.add(x));return M};
  if($('repBtn')) $('repBtn').onclick=()=>{const l=repForms(REP,S.len||20);if(l.length) startSession(l,{M:repM(),rep:new Set(l.map(f=>f.i))});else{const n=$('repNote');n.textContent=tx('noPractice');n.hidden=false}};
  if($('weakBtn')) $('weakBtn').onclick=()=>{
    // ungefär en tredjedel av omgången hämtas ur Repetera, resten ur svagheterna
    const n=S.len||20,r=REP.length?repForms(REP,Math.ceil(n/3)):[],ids=new Set(r.map(f=>f.i));
    const l=shuffle([...r,...weakForms().filter(f=>!ids.has(f.i)).slice(0,n-r.length)]);
    if(!l.length) return start(l,'weakNote');
    // bara formerna som hämtats ur Repetera markeras i övningen
    startSession(l,r.length?{M:repM(momentSet()),rep:ids}:{});
  };
  if($('missBtn')) $('missBtn').onclick=()=>startSession(shuffle(MISSES));
  if($('demoUp')) $('demoUp').onclick=()=>KOP.signOut('signup');
  if($('pSave')) $('pSave').onclick=async()=>{const r=await saveProfile({school:$('pSchool').value.trim(),course:$('pCourse').value.trim()});$('pOk').textContent=r.error?tx('errMsg',r.error.message):tx('saved')};
  $('fbText').oninput=()=>{$('fbCount').textContent=$('fbText').value.length+'/200'};
  $('fbSend').onclick=async()=>{
    const text=$('fbText').value.trim();if(!text) return $('fbText').focus();
    $('fbSend').disabled=true;
    const {error}=await KOP.sb.from('feedback').insert({text,name:$('fbName').value.trim()||null,school:(PROF.school||'').trim()||null,may_quote:$('fbQuote').checked});
    $('fbSend').disabled=false;
    if(error){$('fbOk').textContent=tx('errMsg',error.message);return}
    $('fbText').value='';$('fbCount').textContent='0/200';$('fbOk').textContent=tx('fbThanks');
  };
  if($('aPwBtn')) $('aPwBtn').onclick=async()=>{
    const pw=$('aPw').value;if(pw.length<8){$('aPwOk').textContent=tx('pwShort');return}
    const {error}=await KOP.sb.auth.updateUser({password:pw});
    $('aPwOk').textContent=error?tx('errMsg',error.message):tx('pwChanged');if(!error)$('aPw').value='';
  };
  $('aOut').onclick=()=>KOP.signOut();
  if($('aDel')) $('aDel').onclick=async()=>{
    if(!confirm(tx('deleteConfirm'))) return;
    const {error}=await KOP.sb.rpc('delete_my_account');
    if(error){$('aErr').textContent=tx('errMsg',error.message);return}
    try{localStorage.removeItem('kop-life')}catch(e){}
    KOP.signOut();
  };
}

function renderKingSummary(){
  show('summary');
  const won=sess.correct>=KING_LEN;
  $('summary').innerHTML=`<section class="block mehero"><p class="me-kick">${tx('kingTestShort')}</p>
    <h1 class="me-title">${won?tx('kingWinH'):sess.correct+' / '+KING_LEN}</h1>
    <p class="me-next">${won?tx('kingText'):tx('kingFailH',sess.correct)+' '+tx('kingFailSub')}</p></section>`;
  setTop('summary');
  setActions(won?[{label:tx('toMe'),primary:true,fn:renderMe}]:[{label:tx('kingAgain'),primary:true,fn:()=>startSession(null,{king:true})},{label:tx('toMe'),fn:renderMe}],'');
}

/* ---------- guide ----------
   Ett kort med Fortsätt som går igenom en vy steg för steg. Visad guide sparas i kop-tour. */
let TOUR=null,TOUR_MEM={};
function tourSeen(k){if(TOUR_MEM[k])return true;try{return !!(JSON.parse(localStorage.getItem('kop-tour')||'{}')||{})[k]}catch(e){return false}}
function tourMark(k){TOUR_MEM[k]=true;try{const o=JSON.parse(localStorage.getItem('kop-tour')||'{}')||{};o[k]=1;localStorage.setItem('kop-tour',JSON.stringify(o))}catch(e){}}
function tourReset(){TOUR_MEM={};try{localStorage.removeItem('kop-tour')}catch(e){}}
const isShown=el=>!!el&&el.getClientRects().length>0;
function startTour(key,view,steps,opt){
  if(TOUR||tourSeen(key)||!$('modal').classList.contains('hidden')) return false;
  steps=steps.filter(st=>isShown(st.el()));
  if(!steps.length) return false;
  const ring=document.createElement('div');ring.className='tour-ring';
  const card=document.createElement('div');card.className='tour-card';card.setAttribute('role','dialog');card.setAttribute('aria-label',tx('tourAria'));card.setAttribute('aria-live','polite');
  document.body.append(ring,card);
  TOUR={key,view,steps,i:-1,ring,card,done:(opt&&opt.done)||tx('tourDone'),pos:()=>requestAnimationFrame(tourPlace)};
  addEventListener('scroll',TOUR.pos,{passive:true});addEventListener('resize',TOUR.pos);
  tourNext();
  return true;
}
function tourNext(){
  if(!TOUR) return;
  TOUR.i++;
  if(TOUR.i>=TOUR.steps.length) return endTour();
  const st=TOUR.steps[TOUR.i],n=TOUR.steps.length,last=TOUR.i===n-1,el=st.el();
  if(!isShown(el)) return tourNext();
  TOUR.card.innerHTML=`<p class="tk">${st.kick?esc(st.kick):tx('tourOf',TOUR.i+1,n)}</p><h3>${esc(st.title)}</h3><p class="tt">${st.html||esc(st.text)}</p>${st.prev?`<div class="tprev">${st.prev}</div>`:''}${st.note?`<p class="tt">${esc(st.note)}</p>`:''}
    <div class="tour-row"><button class="tour-skip">${tx('tourSkip')}</button><button class="primary tour-go">${last?TOUR.done:tx('tourNext')}</button></div>`;
  TOUR.card.querySelector('.tour-skip').hidden=last;
  const pv=TOUR.card.querySelector('.tprev'),sg=pv&&pv.querySelector('.segs');
  if(sg&&sg.scrollWidth>pv.clientWidth-16) sg.style.zoom=((pv.clientWidth-16)/sg.scrollWidth).toFixed(3);
  TOUR.card.querySelector('.tour-go').onclick=tourNext;
  TOUR.card.querySelector('.tour-skip').onclick=()=>endTour();
  const r=el.getBoundingClientRect(),beh=matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
  // kort som ska ligga ovanför: rulla så att målet börjar precis under kortet
  if(st.above) window.scrollBy({top:r.top-(16+TOUR.card.offsetHeight+18),behavior:beh});
  else if(r.top<8||r.bottom>innerHeight-180) el.scrollIntoView({block:r.height>innerHeight*.5?'start':'center',behavior:beh});
  tourPlace();
  TOUR.card.querySelector('.tour-go').focus({preventScroll:true});
}
function tourPlace(){
  if(!TOUR||TOUR.i<0) return;
  const el=TOUR.steps[TOUR.i].el();if(!isShown(el)) return;
  const r=el.getBoundingClientRect(),c=TOUR.card,g=6,m=16;
  Object.assign(TOUR.ring.style,{top:r.top-g+'px',left:r.left-g+'px',width:r.width+2*g+'px',height:r.height+2*g+'px'});
  const ab=$('actionbar').getBoundingClientRect(),floor=Math.min(innerHeight,ab.top)-m;
  const cw=c.offsetWidth,ch=c.offsetHeight;
  const below=r.bottom+g+12+ch<=floor,above=r.top-g-12-ch>=m;
  let y;
  if(TOUR.steps[TOUR.i].above) y=r.top-g-12-ch;
  else if(below) y=r.bottom+g+12;
  else if(above) y=r.top-g-12-ch;
  else y=floor-ch;
  const x=Math.max(m,Math.min(innerWidth-cw-m,r.left));
  c.style.top=Math.max(m,y)+'px';c.style.left=x+'px';
}
function endTour(){
  if(!TOUR) return;
  tourMark(TOUR.key);
  removeEventListener('scroll',TOUR.pos);removeEventListener('resize',TOUR.pos);
  TOUR.ring.remove();TOUR.card.remove();TOUR=null;
}
const blockOf=id=>()=>{const e=$(id);return e&&e.closest('.block')};
function setupTour(){
  const acc=ACC&&histReady;
  startTour('setup','setup',[
    {el:blockOf('modeSeg'),title:tx('tMode'),html:tx('tModeT',`<u class="tbtn">${esc(tx('modeFree'))}</u>`,`<u class="tbtn">${esc(tx('modeBook',(BOOKLIST.find(b=>b.id==='mounce')||B).name))}</u>`)},
    {el:()=>FREE()?$('secBlock'):null,title:tx('tSec'),text:tx('tSecT')+(acc?tx('tSecAcc'):'')},
    {el:()=>FREE()?$('vocBlock'):null,title:tx('tVoc'),text:tx('tVocT')},
    {el:()=>FREE()?null:$('lvlExt'),title:tx('tLvl'),text:tx('tLvlT')},
    {el:()=>FREE()?null:$('chBlock'),title:tx('tCh'),text:tx('tChT')+(acc?tx('tChAcc'):'')},
    {el:blockOf('lenSeg'),title:tx('tLen'),text:tx('tLenT')},
    {el:()=>ACC?$('topMeta').querySelector('.tpill'):null,title:tx('tTitle'),text:tx('tTitleT')},
    {el:()=>$('actBtns'),title:tx('tStart'),text:tx('tStartT')}
  ]);
}
function quizTour(){
  const hk=hintCode(),hb=()=>isShown($('hintBtn'))?$('hintBtn'):$('qForm');
  startTour('quiz','quiz',[
    {el:()=>$('qForm'),title:tx('tForm'),text:tx('tFormT')},
    {el:()=>$('fields'),title:tx('tFields'),text:tx('tFieldsT')},
    {el:()=>{const o=$('fields').querySelector('.opts.lex');return o&&o.closest('.field')},title:tx('tLex'),text:tx('tLexT')},
    {el:hb,title:tx('tSplit'),text:tx(hk?'tSplitT':'tSplitNo'),prev:hk?breakdownHTML(hk,'split'):''},
    {el:hb,title:tx('tLabels'),text:tx(hk?'tLabelsT':'tLabelsNo'),prev:hk?breakdownHTML(hk,'labels'):'',note:tx('tHintNote')},
    {el:()=>$('fields'),title:tx('tGo'),text:tx('tGoT'),above:true}
  ]);
}
/* första nya nivån: ett guidekort som pekar på Mina sidor, i stället för den vanliga popupen.
   Visas när knappen syns, alltså efter omgången och inte mitt i övningen. */
let LEVEL_TOUR=0;
function levelTour(view){
  if(!LEVEL_TOUR||TOUR) return;
  const t=LEVEL_TOUR;
  if(startTour('level',view,[{el:()=>$('meBtn'),kick:tx('tLevelKick',titleName(t)),title:tx('tLevel'),text:tx('tLevelT')}],{done:tx('tourNext')})) LEVEL_TOUR=0;
}
$('tourAgain').onclick=()=>{endTour();tourReset();window.scrollTo(0,0);setupTour()};

/* ---------- chrome ---------- */
function show(id){if(TOUR&&TOUR.view!==id)endTour();['setup','quiz','summary','me'].forEach(x=>$(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0)}
function setTop(view){
  const m=$('topMeta');
  if(view==='quiz'){
    m.innerHTML=`<span class="pill">${sess.king?tx('kingQuiz',sess.correct,sess.total):tx('topScore',sess.correct,sess.answered)}</span><button class="pill" id="endBtn">${tx('end')}</button>`;
    $('endBtn').onclick=()=>{if(sess.answered)renderSummary();else{show('setup');renderSetup()}};
  } else if(ACC){
    const {t,p}=titleProgress();
    m.innerHTML=`<span class="pill tpill" title="${esc(tx('yourLevel'))}"><span>${esc(titleName(t))}</span>${t<KING?`<span class="tbar" role="img" aria-label="${esc(tx('levelProgress',p))}"><i style="width:${p}%"></i></span>`:''}</span><button class="pill mebtn" id="meBtn"${view==='me'?' aria-current="page"':''}>${tx('myPage')}</button>`;
    $('meBtn').onclick=()=>renderMe();
    if(LEVEL_TOUR&&view!=='me') setTimeout(()=>levelTour(view),300);
  } else m.innerHTML=life.a?`<span class="pill">${tx('topTotal',life.c,life.a)}</span>`:'';
}
let actFns=[];
function setActions(list,hint){
  $('kbdHint').innerHTML=hint;
  const box=$('actBtns');box.innerHTML='';actFns=list;
  list.forEach(a=>{const b=document.createElement('button');b.className=a.primary?'primary':'ghost';b.textContent=a.label;b.disabled=!!a.disabled;b.onclick=a.fn;box.appendChild(b)});
}
$('hintBtn').onclick=e=>{q.hint=Math.min(q.hint+1,2);renderQuiz();e.currentTarget.blur()};
$('homeBtn').onclick=()=>{show('setup');renderSetup()};
document.addEventListener('keydown',e=>{
  if(TOUR){if(e.key==='Enter'){e.preventDefault();tourNext()}else if(e.key==='Escape'){e.preventDefault();endTour()}return}
  if(!$('modal').classList.contains('hidden')){if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();closeModal()}return}
  if(e.key!=='Enter'||e.metaKey||e.ctrlKey) return;
  if(!$('quiz').classList.contains('hidden')){
    e.preventDefault();
    if(q.checked) nextQuestion(); else check();
  }
});
$('demoNote').hidden=!DEMO;
renderSetup();
loadAccount();
})();
</script>
